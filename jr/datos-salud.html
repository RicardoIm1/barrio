<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a0810">
  <meta name="description" content="Aviso para quien solicita software clínico. Datos de salud, ley mexicana y lo que implica pasar de la libreta al sistema.">
  <title>Datos de salud | Antes de la primera línea de código</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0b1117;--bg2:#111a22;--panel:rgba(255,255,255,.055);--panel2:rgba(255,255,255,.075);
      --line:rgba(255,255,255,.12);--text:#edf3f7;--muted:#a9b6c0;--soft:#d3dde3;
      --accent:#72b8d6;--accent2:#b8dced;--warm:#d4a66a;--max:1180px;--radius:26px;
      --shadow:0 24px 70px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;background:
      radial-gradient(circle at 80% 0%,rgba(82,139,166,.13),transparent 30rem),
      radial-gradient(circle at 10% 30%,rgba(255,255,255,.035),transparent 25rem),
      var(--bg);
      color:var(--text);font-family:"DM Sans",system-ui,sans-serif;line-height:1.65;
    }
    body:before{
      content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
      background:linear-gradient(115deg,transparent 0 48%,rgba(255,255,255,.018) 48.2% 48.4%,transparent 48.6%);
    }
    a{color:inherit;text-decoration:none}
    button,input,textarea{font:inherit}
    .wrap{width:min(calc(100% - 40px),var(--max));margin:auto}
    .eyebrow{
      display:inline-flex;align-items:center;gap:9px;color:var(--accent2);
      font-size:.76rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    }
    .eyebrow:before{content:"";width:24px;height:1px;background:var(--accent)}
    h1,h2,h3{font-family:Manrope,sans-serif;line-height:1.08;margin:0}
    h1{font-size:clamp(3rem,7vw,6.8rem);letter-spacing:-.065em;max-width:1050px}
    h2{font-size:clamp(2rem,4vw,3.8rem);letter-spacing:-.045em}
    h3{font-size:1.25rem;letter-spacing:-.02em}
    p{margin:0;color:var(--muted)}
    .lead{font-size:clamp(1.05rem,1.7vw,1.28rem);max-width:760px}
    .nav{
      position:sticky;top:0;z-index:20;
      background:rgba(11,17,23,.78);backdrop-filter:blur(20px);
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .navin{height:72px;display:flex;align-items:center;justify-content:space-between;gap:25px}
    .brand{display:flex;align-items:center;gap:12px;font-family:Manrope;font-weight:800;letter-spacing:-.03em}
    .mark{width:38px;height:38px;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;background:var(--panel)}
    .mark span{font-size:.82rem}
    .links{display:flex;gap:23px;color:#b8c4cc;font-size:.88rem}
    .links a:hover{color:white}
    .navcta,.btn{
      display:inline-flex;align-items:center;justify-content:center;gap:9px;
      min-height:46px;padding:0 19px;border-radius:14px;border:1px solid var(--line);
      background:rgba(255,255,255,.06);color:var(--text);font-weight:700;cursor:pointer;
      transition:.2s ease;
    }
    .navcta:hover,.btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.1)}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#091118}
    .btn.primary:hover{background:#8bc7df}
    .menu{display:none;background:none;border:0;color:white;font-size:1.4rem}
    section{padding:120px 0;scroll-margin-top:70px}
    .hero{padding:120px 0 105px;min-height:calc(100vh - 72px);display:flex;align-items:center}
    .hero-grid{display:grid;grid-template-columns:1.25fr .55fr;gap:70px;align-items:end}
    .hero h1{margin:24px 0 28px}
    .hero h1 em{font-style:normal;color:var(--accent2)}
    .hero-copy{font-size:1.15rem;max-width:690px}
    .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
    .micro{margin-top:24px;font-size:.86rem;color:#8796a1;max-width:650px}
    .hero-side{border-left:1px solid var(--line);padding-left:30px}
    .hero-side strong{display:block;font-family:Manrope;font-size:1.55rem;line-height:1.2;margin-bottom:10px}
    .hero-side p{font-size:.92rem}
    .tagrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
    .tag{padding:7px 11px;border:1px solid var(--line);border-radius:999px;color:#bac7cf;font-size:.78rem}
    .darkband{background:rgba(255,255,255,.025);border-block:1px solid rgba(255,255,255,.06)}
    .section-head{display:grid;grid-template-columns:.75fr 1.25fr;gap:50px;margin-bottom:55px}
    .section-head h2{margin-top:16px}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .card{
      padding:30px;border:1px solid var(--line);border-radius:var(--radius);
      background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.025));
      box-shadow:var(--shadow);
    }
    .card .num{font-family:Manrope;color:var(--accent);font-size:.78rem;font-weight:800;letter-spacing:.12em}
    .card h3{margin:24px 0 12px}
    .card p{font-size:.94rem}
    .quote{
      margin-top:30px;padding:25px 28px;border-left:2px solid var(--accent);
      background:rgba(255,255,255,.025);border-radius:0 16px 16px 0;
      color:#dfe8ed;font-family:Manrope;font-size:1.1rem;
    }
    .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:24px;overflow:hidden}
    .step{background:#101820;padding:30px;min-height:235px}
    .step .n{font-family:Manrope;font-size:2rem;color:rgba(255,255,255,.2)}
    .step h3{margin:25px 0 10px}
    .services{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
    .service{padding:30px;border:1px solid var(--line);border-radius:24px;background:var(--panel)}
    .service h3{margin-bottom:10px}
    .service ul{padding:0;margin:18px 0 0;list-style:none;color:var(--muted);font-size:.9rem}
    .service li{padding:7px 0;border-top:1px solid rgba(255,255,255,.07)}
    .service li:first-child{border-top:0}
    .toolkit{display:flex;flex-wrap:wrap;gap:9px;margin-top:28px}
    .tool{padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.055);border:1px solid var(--line);font-size:.78rem;color:#b8c5cd}
    .demo{display:grid;grid-template-columns:.7fr 1.3fr;gap:18px}
    .demo-panel{border:1px solid var(--line);border-radius:24px;background:var(--panel);padding:28px}
    .demo-panel label{display:block;font-size:.76rem;color:#9eabb4;text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}
    .demo-panel input{width:100%;border:1px solid var(--line);background:rgba(0,0,0,.16);color:white;padding:12px 13px;border-radius:12px;outline:0}
    .demo-panel input:focus{border-color:var(--accent)}
    .demo-result{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
    .metric{padding:22px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.035)}
    .metric b{display:block;font-family:Manrope;font-size:1.6rem;margin-bottom:3px}
    .metric span{font-size:.75rem;color:#9eabb4}
    .demo-note{font-size:.76rem;margin-top:18px;color:#82919b}
    .cases{display:grid;gap:16px}
    .case{display:grid;grid-template-columns:.34fr 1fr;gap:35px;padding:32px;border:1px solid var(--line);border-radius:24px;background:var(--panel)}
    .case .type{color:var(--accent);font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;font-weight:700}
    .case h3{margin:9px 0 12px}
    .casegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
    .casegrid div{padding:15px;background:rgba(255,255,255,.035);border-radius:14px}
    .casegrid strong{display:block;font-size:.75rem;color:#d9e3e8;margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em}
    .lab{display:grid;grid-template-columns:.8fr 1.2fr;gap:18px}
    .lab-controls,.lab-chart{border:1px solid var(--line);border-radius:24px;background:var(--panel);padding:28px}
    .range{width:100%}
    .bars{height:250px;display:flex;align-items:end;gap:8px;margin-top:25px;padding-bottom:4px;border-bottom:1px solid var(--line)}
    .bar{flex:1;min-width:8px;border-radius:5px 5px 0 0;background:linear-gradient(to top,var(--accent),rgba(114,184,214,.2));height:30%}
    .arch{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:stretch;margin-top:35px}
    .arch div{min-height:110px;padding:17px;border:1px solid var(--line);border-radius:16px;background:var(--panel);font-size:.78rem}
    .arch strong{display:block;color:var(--accent2);margin-bottom:8px;font-size:.75rem}
    .not{margin-top:20px;padding:20px;border:1px solid rgba(212,166,106,.35);background:rgba(212,166,106,.06);border-radius:18px}
    .not strong{color:#e5c08f}
    .work{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
    .work div{padding:23px 18px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}
    .work b{display:block;color:var(--accent);font-size:.75rem;margin-bottom:12px}
    .money{display:grid;grid-template-columns:1fr .75fr;gap:20px;align-items:stretch}
    .money-main,.money-side{border:1px solid var(--line);border-radius:26px;padding:36px;background:var(--panel)}
    .money-main h2{margin:15px 0}
    .money-side ul{list-style:none;padding:0;margin:0}
    .money-side li{padding:13px 0;border-top:1px solid var(--line);color:var(--muted)}
    .money-side li:first-child{border-top:0}
    .about{display:grid;grid-template-columns:.7fr 1.3fr;gap:70px}
    .about h2{margin:15px 0 22px}
    .about p+p{margin-top:18px}
    .principles{display:grid;gap:12px}
    .principle{padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}
    .principle b{display:block;margin-bottom:5px;color:#e2edf2}
    .contact{display:grid;grid-template-columns:.8fr 1.2fr;gap:50px}
    form{display:grid;gap:13px}
    .field{display:grid;gap:7px}
    .field label{font-size:.77rem;color:#9aa8b1}
    .field input,.field textarea{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.045);color:white;border-radius:13px;padding:12px 13px;outline:0}
    .field textarea{min-height:145px;resize:vertical}
    .field input:focus,.field textarea:focus{border-color:var(--accent)}
    .formstatus{font-size:.82rem;color:var(--accent2);min-height:22px}
    footer{padding:45px 0;border-top:1px solid var(--line);background:#080d12}
    .foot{display:flex;justify-content:space-between;gap:30px;align-items:end}
    .foot p{font-size:.82rem}
    .footnav{display:flex;gap:18px;color:#8e9ba5;font-size:.8rem}
    .reveal{opacity:0;transform:translateY(14px);transition:.7s ease}
    .reveal.show{opacity:1;transform:none}
    @media(max-width:900px){
      .links{display:none}.menu{display:block}.navcta{display:none}
      .hero-grid,.section-head,.demo,.lab,.money,.about,.contact{grid-template-columns:1fr}
      .hero-side{border-left:0;border-top:1px solid var(--line);padding:25px 0 0}
      .cards,.services{grid-template-columns:1fr}
      .steps{grid-template-columns:1fr 1fr}
      .arch{grid-template-columns:repeat(2,1fr)}
      .work{grid-template-columns:1fr 1fr}
      .case{grid-template-columns:1fr}
    }
    @media(max-width:560px){
      .wrap{width:min(calc(100% - 26px),var(--max))}
      section{padding:82px 0}
      .hero{padding:85px 0}
      h1{font-size:clamp(2.65rem,14vw,4rem)}
      .steps,.demo-result,.casegrid,.work{grid-template-columns:1fr}
      .arch{grid-template-columns:1fr}
      .foot{align-items:start;flex-direction:column}
    }
  </style>

  <!-- Tema día/noche (heredado de index.html) -->
  <style id="accessible-theme-switch">
    .theme-toggle{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 13px;border:1px solid rgba(218,207,255,.22);border-radius:8px;background:rgba(255,255,255,.07);color:#f3effb;font:600 .82rem/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;white-space:nowrap;cursor:pointer;transition:background .18s,border-color .18s,transform .18s}
    .theme-toggle:hover{transform:translateY(-1px);border-color:#8b6cff;background:rgba(139,108,255,.14)}
    .theme-icon{font-size:1.15rem;line-height:1}

    body[data-theme="dark"] .links a{color:#d6d0e2}
    body[data-theme="dark"] .links a:hover,body[data-theme="dark"] #mobileNav a:hover{color:#fff}
    body[data-theme="dark"] .hero{background:linear-gradient(135deg,rgba(255,255,255,.018) 0%,rgba(255,255,255,.008) 100%)}
    body[data-theme="dark"] .hero .lead,body[data-theme="dark"] .hero-copy,body[data-theme="dark"] .hero .micro{color:#d5cede}
    body[data-theme="dark"] .hero-side p{color:#c6bed3}
    body[data-theme="dark"] .hero-side strong{color:#fff}
    body[data-theme="dark"] .theme-toggle{color:#f3effb}
    body[data-theme="light"]{
      --bg:#f8f9fa;--bg2:#fff;--panel:rgba(255,255,255,.92);--panel2:#fff;
      --line:#e2e8ee;--text:#2c3e50;--muted:#526273;--soft:#34495e;
      --accent:#287fb8;--accent2:#216a9b;--warm:#a97823;
      background:#f8f9fa;color:#2c3e50
    }
    body[data-theme="light"]{
      background:
        radial-gradient(700px 420px at 82% -5%,rgba(52,152,219,.09),transparent 68%),

        radial-gradient(500px 350px at 65% 88%,rgba(52,152,219,.025),transparent 72%),
        linear-gradient(180deg,#f8f9fa 0%,#f3f6f8 48%,#f8f9fa 100%);
    }
    body[data-theme="light"]:before{opacity:0}

    body[data-theme="light"] .brandtext strong span{color:#287fb8}
    body[data-theme="light"] .brandtext small{color:#627487}
    body[data-theme="light"] .links a,body[data-theme="light"] #mobileNav a{color:#34495e}
    body[data-theme="light"] .links a:hover,body[data-theme="light"] #mobileNav a:hover{color:#17679d}
    body[data-theme="light"] .mark{background:linear-gradient(145deg,#fff,#eaf3f9);border-color:#d4e0e8;box-shadow:0 4px 12px rgba(44,62,80,.08)}
    body[data-theme="light"] .theme-toggle{background:#fff;color:#2c3e50;border-color:#d5dfe7}
    body[data-theme="light"] .theme-toggle:hover{background:#edf6fc;border-color:#3498db}
    body[data-theme="light"] .navcta,body[data-theme="light"] .btn{background:#fff;border-color:#d5dfe7;color:#2c3e50;box-shadow:0 2px 7px rgba(44,62,80,.04)}
    body[data-theme="light"] .navcta:hover,body[data-theme="light"] .btn:hover{background:#f0f7fc;border-color:#3498db}
    body[data-theme="light"] .btn.primary{background:#2c3e50;color:#fff;border-color:#2c3e50}
    body[data-theme="light"] .btn.primary:hover{background:#34495e}
    body[data-theme="light"] .hero{background:linear-gradient(135deg,#fff 0%,#eef5fa 100%);border-bottom:1px solid #e2e8ee}
    body[data-theme="light"] h1,body[data-theme="light"] h2,body[data-theme="light"] h3{color:#2c3e50}
    body[data-theme="light"] p,body[data-theme="light"] .lead,body[data-theme="light"] .hero-copy,body[data-theme="light"] .hero .micro{color:#46596b}
    body[data-theme="light"] .eyebrow{color:#236e9e}
    body[data-theme="light"] .eyebrow:before{background:#3498db}
    body[data-theme="light"] .hero h1 em{color:#216a9b;text-shadow:none}
    body[data-theme="light"] .hero-side{border-color:#d8e3eb}
    body[data-theme="light"] .hero-side strong{color:#2c3e50}
    body[data-theme="light"] .hero-side p{color:#526273}
    body[data-theme="light"] .darkband{background:#eef3f6;border-block-color:#dfe6eb}
    body[data-theme="light"] .card,body[data-theme="light"] .service,body[data-theme="light"] .demo-panel,body[data-theme="light"] .lab-controls,body[data-theme="light"] .lab-chart,body[data-theme="light"] .case,body[data-theme="light"] .money-main,body[data-theme="light"] .money-side,body[data-theme="light"] .principle,body[data-theme="light"] .work div,body[data-theme="light"] .arch div,body[data-theme="light"] .metric{
      background:linear-gradient(145deg,#fff 0%,#f8fafc 100%);border-color:#e0e7ec;box-shadow:0 6px 20px rgba(44,62,80,.06);backdrop-filter:none
    }
    body[data-theme="light"] .card .num,body[data-theme="light"] .case .type,body[data-theme="light"] .work b,body[data-theme="light"] .arch strong,body[data-theme="light"] .principle b{color:#286f9d}
    body[data-theme="light"] .tag{background:#f1f6fa;border-color:#dce6ed;color:#34495e}
    body[data-theme="light"] .quote{background:#f1f6fa;border-left-color:#3498db;color:#34495e}
    body[data-theme="light"] .step{background:#fff;color:#2c3e50;border:1px solid #e0e7ec}
    body[data-theme="light"] .step .n{color:#8495a5}
    body[data-theme="light"] .tool{background:#f3f6f8;border-color:#e0e7ec;color:#34495e}
    body[data-theme="light"] .demo-panel label,body[data-theme="light"] .field label{color:#526273}
    body[data-theme="light"] .demo-panel input,body[data-theme="light"] .field input,body[data-theme="light"] .field textarea{background:#fff;color:#2c3e50;border-color:#cbd7e0}
    body[data-theme="light"] .demo-panel input:focus,body[data-theme="light"] .field input:focus,body[data-theme="light"] .field textarea:focus{border-color:#3498db;box-shadow:0 0 0 3px rgba(52,152,219,.13)}
    body[data-theme="light"] .metric span,body[data-theme="light"] .demo-note,body[data-theme="light"] .service ul,body[data-theme="light"] .money-side li,body[data-theme="light"] .footnav{color:#647587}
    body[data-theme="light"] .bar{background:linear-gradient(to top,#3498db,rgba(52,152,219,.25))}
    body[data-theme="light"] .not{border-color:#efd8ad;background:#fff8ed}
    body[data-theme="light"] .not strong{color:#8d5d17}
    body[data-theme="light"] footer{background:#fff;border-top-color:#e0e7ec}
    body[data-theme="light"] footer .brand,body[data-theme="light"] footer .brandtext strong{color:#2c3e50}
    body[data-theme="light"] footer .brandtext small,body[data-theme="light"] footer p,body[data-theme="light"] footer .footnav{color:#647587}
    body[data-theme="light"] footer .mark{background:#edf6fc;border-color:#d4e0e8;color:#2c3e50}
    @media(max-width:900px){.theme-toggle{margin-left:auto}.navin{gap:10px}}

    html.theme-transition body *,
    html.theme-transition body *::before,

      transition:background-color 2.8s ease-in-out,background-image 2.8s ease-in-out,background 2.8s ease-in-out,color 2.8s ease-in-out,border-color 2.8s ease-in-out,box-shadow 2.8s ease-in-out,fill 2.8s ease-in-out,stroke 2.8s ease-in-out,opacity 2.8s ease-in-out !important;
    }

      html.theme-transition body,html.theme-transition body *,html.theme-transition body *::before,html.theme-transition body *::after{transition-duration:.01ms !important}
    }
    .hero-grid > article.hero-side{
      display:flex;flex-direction:column;justify-content:center;align-self:stretch;min-width:0;
      padding:clamp(24px,2.5vw,34px) !important;
      border:1px solid rgba(218,207,255,.14) !important;

      box-shadow:var(--shadow);

    .hero-side-label{

    }
    .hero-grid > article.hero-side h2{margin:0 0 16px;max-width:13ch;font-size:clamp(1.45rem,2vw,2rem);line-height:1.18;letter-spacing:-.035em}
    .hero-grid > article.hero-side p{max-width:34ch;margin:0;color:#c6bed3;font-size:.96rem;line-height:1.8}
    body[data-theme="light"] .hero-grid > article.hero-side{background:linear-gradient(145deg,#fff,#f3f7fa) !important;border-color:#e0e7ec !important;border-top-color:#3498db !important;box-shadow:0 8px 24px rgba(44,62,80,.07)}
    body[data-theme="light"] .hero-side-label{color:#287fb8}
    body[data-theme="light"] .hero-grid > article.hero-side h2{color:#2c3e50}
