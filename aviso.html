<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta name="google-site-verification" content="fmtZKP7ZEDNEcmHyx08vsSQn8wVmqfE2WlKtGyBo968" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta http-equiv="Strict-Transport-Security" content="max-age=31536000; includeSubDomains">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <title>Aviso - EL BARRIO</title>
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/estilo.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2c3e50">

    <style>
        /* =========================================================
           EL BARRIO · AVISO INDIVIDUAL
           Estilos aislados de la página de detalle.
        ========================================================= */
        :root {
            --av-bg: #f5f5f5;
            --av-card: #ffffff;
            --av-text: #1c1c1e;
            --av-muted: #737373;
            --av-border: #e8e8ec;
            --av-primary: #2c3e50;
            --av-gold: #d4a043;
            --av-orange: #f5b042;
            --av-green: #25D366;
            --av-danger: #dc3545;
            --av-shadow: 0 10px 35px rgba(0,0,0,.08);
            --av-radius: 22px;
        }

        html, body {
            min-height: 100%;
            margin: 0;
        }

        body {
            background: var(--av-bg) !important;
            color: var(--av-text) !important;
            padding-top: 0 !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
        }

        #aviso-container {
            width: min(900px, calc(100% - 32px));
            margin: 0 auto;
            padding: 36px 0 56px;
        }

        .aviso-paper {
            display: block;
            width: 100%;
            background: var(--av-card) !important;
            border: 1px solid var(--av-border);
            border-radius: var(--av-radius);
            overflow: hidden;
            box-shadow: var(--av-shadow);
        }

        .article-header {
            padding: 34px 38px 25px;
            background: linear-gradient(135deg, #ffffff 0%, #fafafa 100%);
            border-bottom: 1px solid var(--av-border);
        }

        .article-category {
            display: inline-flex;
            align-items: center;
            padding: 6px 13px;
            border-radius: 999px;
            background: rgba(245,176,66,.14);
            color: #9a6710;
            border: 1px solid rgba(245,176,66,.25);
            font-size: .76rem;
            font-weight: 700;
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        .article-title {
            margin: 14px 0 12px !important;
            color: var(--av-primary) !important;
            font-size: clamp(1.8rem, 4vw, 2.65rem) !important;
            line-height: 1.12 !important;
            font-weight: 750 !important;
            letter-spacing: -.025em;
        }

        .article-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 18px;
            color: var(--av-muted);
            font-size: .88rem;
        }

        .article-meta span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .article-body {
            padding: 32px 38px 30px;
        }

        .article-content {
            color: #303035;
            font-size: 1.08rem;
            line-height: 1.78;
            overflow-wrap: anywhere;
        }

        .article-content p {
            margin: 0 0 1em;
        }

        .article-content p:last-child {
            margin-bottom: 0;
        }

        .stats-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 9px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--av-border);
        }

        .stat-item.action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            min-height: 42px;
            padding: 8px 14px;
            border: 1px solid var(--av-border);
            border-radius: 999px;
            background: #fff;
            color: #555 !important;
            font: inherit;
            font-size: .88rem;
            cursor: pointer;
            transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
        }

        .stat-item.action-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 14px rgba(0,0,0,.08);
            background: #fafafa;
        }

        .stat-icon {
            font-size: 1rem;
            line-height: 1;
        }

        .stat-value {
            font-weight: 650;
        }

        .whatsapp-stat {
            background: var(--av-green) !important;
            border-color: var(--av-green) !important;
            color: #fff !important;
        }

        .whatsapp-stat .stat-value {
            color: #fff !important;
        }

        .whatsapp-btn-circle {
            flex: 0 0 auto;
            width: 44px;
            height: 44px;
            border: 0;
            border-radius: 50%;
            background-color: var(--av-green);
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/WhatsApp.svg/960px-WhatsApp.svg.png');
            background-size: 60%;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 3px 12px rgba(0,0,0,.15);
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .whatsapp-btn-circle:hover {
            transform: scale(1.08);
            box-shadow: 0 5px 16px rgba(0,0,0,.2);
        }

        .patrocinador-box {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 22px 0 0;
            padding: 14px 16px;
            background: #fff;
            border: 1px solid var(--av-border);
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0,0,0,.04);
        }

        .patrocinador-icon {
            width: 42px;
            height: 42px;
            flex: 0 0 42px;
            display: grid;
            place-items: center;
            background: rgba(245,176,66,.12);
            border-radius: 11px;
            font-size: 1.1rem;
        }

        .patrocinador-copy {
            flex: 1;
            min-width: 0;
        }

        .patrocinador-copy strong {
            display: block;
            margin-bottom: 2px;
            color: var(--av-text);
            font-size: .9rem;
        }

        .patrocinador-copy span {
            display: block;
            color: var(--av-muted);
            font-size: .76rem;
            line-height: 1.35;
        }

        .loading-state,
        .error-message {
            width: 100%;
            padding: 45px 25px;
            text-align: center;
            background: #fff;
            border: 1px solid var(--av-border);
            border-radius: var(--av-radius);
            box-shadow: var(--av-shadow);
            color: var(--av-muted);
        }

        .error-message {
            color: var(--av-danger);
        }

        .comments-section {
            margin-top: 28px;
            background: #fff;
            border: 1px solid var(--av-border);
            border-radius: 18px;
            padding: 22px;
        }

        .comments-section h2 {
            margin: 0 0 15px;
            font-size: 1.05rem;
            color: var(--av-primary);
        }

        .comment-item {
            padding: 13px 0;
            border-bottom: 1px solid var(--av-border);
        }

        .comment-item:last-child {
            border-bottom: 0;
        }

        .comment-author {
            font-weight: 700;
            color: var(--av-primary);
            font-size: .88rem;
        }

        .comment-text {
            margin-top: 4px;
            color: #444;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .comment-date {
            margin-top: 5px;
            color: var(--av-muted);
            font-size: .74rem;
        }

        @media (max-width: 600px) {
            #aviso-container {
                width: min(100% - 18px, 900px);
                padding: 10px 0 30px;
            }

            .aviso-paper {
                border-radius: 17px;
            }

            .article-header {
                padding: 25px 20px 20px;
            }

            .article-title {
                font-size: 1.65rem !important;
            }

            .article-body {
                padding: 23px 20px 22px;
            }

            .article-content {
                font-size: 1rem;
                line-height: 1.68;
            }

            .stats-row {
                gap: 7px;
                margin-top: 24px;
            }

            .stat-item.action-btn {
                min-height: 40px;
                padding: 7px 11px;
                font-size: .82rem;
            }

            .patrocinador-box {
                gap: 10px;
                padding: 12px;
            }
        }
    </style>
</head>

<body>
    <div id="aviso-container"></div>

    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/auth.js"></script>

    <script>
        const AVISO_ID = new URLSearchParams(window.location.search).get('id');
        let avisoActual = null;
        let usuarioActual = null;

        function escapeHTML(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        async function cargarComentarios(avisoId) {
            const commentsList = document.getElementById('comments-list');
            if (!commentsList) return;
            commentsList.innerHTML = '<div class="cargando">💬 Cargando comentarios...</div>';
            try {
                const apiKey = localStorage.getItem('api_key');
                const resultado = await API.peticion('LISTAR_COMENTARIOS', { avisoId: avisoId }, apiKey);
                console.log('Comentarios respuesta:', resultado);
                if (resultado && resultado.success) {
                    let comentarios = [];
                    if (resultado.data && Array.isArray(resultado.data)) comentarios = resultado.data;
                    else if (resultado.datos && Array.isArray(resultado.datos)) comentarios = resultado.datos;
                    if (comentarios.length === 0) {
                        commentsList.innerHTML = '<div style="text-align:center; color:#888;">📝 No hay comentarios aún. ¡Sé el primero!</div>';
                    } else {
                        commentsList.innerHTML = comentarios.map(com => {
                            const fechaComentario = com.fecha || com.created_at || com.timestamp || com.fechacreacion;
                            return `<div class="comment-item">
                                <div class="comment-author">${escapeHTML(com.autor || com.usuario_nombre || com.usuario_email || 'Anónimo')}</div>
                                <div class="comment-text">${escapeHTML(com.texto || com.comentario || com.contenido)}</div>
                                <div class="comment-date">${formatearFecha(fechaComentario)}</div>
                            </div>`;
                        }).join('');
                    }
                } else {
                    commentsList.innerHTML = '<div style="text-align:center; color:#888;">💬 Inicia sesión para ver y publicar comentarios.</div>';
                }
            } catch (error) {
                console.error('Error cargando comentarios:', error);
                commentsList.innerHTML = '<div style="text-align:center; color:#888;">💬 No fue posible cargar los comentarios.</div>';
            }
        }

        function renderizarAviso() {
            const aviso = avisoActual;
            if (!aviso) return;

            const autor = aviso.nombre_autor || aviso.autor_nombre || aviso.nombre_usuario || 'Vecino';
            const titulo = aviso.titulo || aviso.nombre || 'Aviso';
            const descripcion = aviso.descripcion || aviso.contenido || aviso.texto || '';
            const categoria = aviso.categoria || 'General';
            const fecha = aviso.created_at || aviso.fecha || aviso.timestamp;
            const vistas = aviso.vistas || aviso.visitas || 0;
            const likes = aviso.likes || 0;
            const dislikes = aviso.dislikes || 0;
            const comentarios = aviso.comments_count || aviso.comentarios || 0;
            const numero = aviso.telefono || aviso.whatsapp || aviso.contacto || '';
            const tieneContacto = !!numero;
            const mensaje = `Hola, vi tu aviso "${titulo}" en EL BARRIO`;

            let html = `<article class="aviso-paper">
                <header class="article-header">
                    <span class="article-category">${escapeHTML(categoria)}</span>
                    <h1 class="article-title">${escapeHTML(titulo)}</h1>
                    <div class="article-meta">
                        <span>👤 ${escapeHTML(autor)}</span>
                        <span>📅 ${escapeHTML(fecha ? new Date(fecha).toLocaleString('es-MX') : '')}</span>
                        <span>👁️ <span class="vistas-count">${vistas}</span></span>
                    </div>
                </header>
                <div class="article-body">
                    <div class="article-content">${descripcion.split(/\n+/).map(p => `<p>${escapeHTML(p)}</p>`).join('')}</div>
                    <div class="stats-row">
                        <div class="stat-item action-btn like-btn" onclick="darLike('${escapeHTML(aviso.id)}')">
                            <span class="stat-icon">👍</span><span class="stat-value likes-count">${likes}</span>
                        </div>
                        <div class="stat-item action-btn dislike-btn" onclick="darDislike('${escapeHTML(aviso.id)}')">
                            <span class="stat-icon">👎</span><span class="stat-value dislikes-count">${dislikes}</span>
                        </div>
                        <div class="stat-item action-btn" onclick="abrirComentarios('${escapeHTML(aviso.id)}', event)">
                            <span class="stat-icon">💬</span><span class="stat-value comments-count">${comentarios}</span>
                        </div>
                        ${tieneContacto ? `<button class="stat-item action-btn whatsapp-stat" onclick="handleWhatsAppClick('${escapeHTML(aviso.id)}', '${escapeHTML(numero)}', '${escapeHTML(mensaje)}', event)"><span class="stat-icon">📱</span><span class="stat-value">WhatsApp</span></button>` : ''}
                    </div>
                </div>
            </article>
            <div class="patrocinador-box">
                <div class="patrocinador-icon"><span>📢</span></div>
                <div class="patrocinador-copy">
                    <strong>¿Quieres ser Patrocinador?</strong>
                    <span>Llega a más vecinos en El Barrio contactando conmigo</span>
                </div>
                <button class="whatsapp-btn-circle" onclick="handleWhatsAppClick('anuncio','3222354331','Hola quiero anunciarme en EL BARRIO',event)" aria-label="Contactar por WhatsApp"></button>
            </div>`;

            document.getElementById('aviso-container').innerHTML = html;
        }

        async function cargarAviso() {
            const container = document.getElementById('aviso-container');
            if (!AVISO_ID) {
                container.innerHTML = '<div class="error-message">❌ No se especificó ningún aviso</div>';
                return;
            }
            container.innerHTML = '<div class="loading-state">📰 Cargando aviso...</div>';
            try {
                usuarioActual = API.getUsuarioActual();
                const resultado = await API.peticion('OBTENER_AVISO_POR_ID', { id: AVISO_ID });
                if (resultado && resultado.success && resultado.data) {
                    avisoActual = resultado.data;
                    if (typeof API.registrarVista === 'function') {
                        API.registrarVista(AVISO_ID).catch(error => {
                            console.warn('No se pudo registrar la vista:', error);
                        });
                    }
                    renderizarAviso();
                    cargarComentarios(AVISO_ID);
                    setTimeout(() => actualizarContadorVistas(), 500);
                } else {
                    container.innerHTML = `<div class="error-message">❌ Aviso no encontrado: ${escapeHTML(AVISO_ID)}</div>`;
                }
            } catch (error) {
                console.error('Error cargando aviso:', error);
                container.innerHTML = `<div class="error-message">❌ Error al cargar el aviso: ${escapeHTML(error.message)}</div>`;
            }
        }

        async function actualizarContadorVistas() {
            try {
                const apiKey = localStorage.getItem('api_key');
                const resultado = await API.peticion('OBTENER_ESTADISTICAS', { id: AVISO_ID }, apiKey);
                if (resultado && resultado.success && resultado.data) {
                    const vistasSpan = document.querySelector('.vistas-count');
                    if (vistasSpan) vistasSpan.textContent = resultado.data.vistas || resultado.data.visitas || 0;
                }
            } catch (e) { console.warn('Error actualizando vistas:', e); }
        }

        document.addEventListener('DOMContentLoaded', cargarAviso);
    </script>
</body>
</html>
