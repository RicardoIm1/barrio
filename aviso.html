<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Aviso - EL BARRIO</title>
<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="/css/estilo.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2c3e50">
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#20242a;--muted:#747b84;--border:#e7eaee;--primary:#2c3e50;--primary-2:#34495e;--gold:#d4a043;--green:#25D366;--danger:#dc3545;--shadow:0 18px 55px rgba(28,42,56,.10);--shadow-soft:0 8px 28px rgba(28,42,56,.07)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:radial-gradient(circle at 50% -10%,rgba(52,73,94,.09),transparent 35%),var(--bg)!important;color:var(--text)!important;padding:0!important;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif!important}
#header-container{width:100%}#aviso-container{width:min(920px,calc(100% - 32px));margin:auto;padding:34px 0 70px}.aviso-paper{position:relative;background:rgba(255,255,255,.96);border:1px solid rgba(231,234,238,.95);border-radius:26px;overflow:hidden;box-shadow:var(--shadow)}
.article-header{position:relative;padding:38px 44px 30px;background:linear-gradient(135deg,#fff 0%,#fbfcfd 58%,#f5f8fa 100%);border-bottom:1px solid var(--border)}.article-header:after{content:"";position:absolute;left:44px;bottom:-1px;width:76px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--gold),#f0c66d)}
.article-category{display:inline-flex;align-items:center;padding:7px 13px;border-radius:999px;background:rgba(212,160,67,.12);color:#8d651e;border:1px solid rgba(212,160,67,.25);font-size:.73rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.article-title{max-width:780px;margin:15px 0 14px!important;color:var(--primary)!important;font-size:clamp(2rem,5vw,3rem)!important;line-height:1.08!important;letter-spacing:-.035em;font-weight:800!important}.article-meta{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--muted);font-size:.88rem}.article-meta span{display:inline-flex;align-items:center;gap:5px}
.article-body{padding:0 44px 36px}.article-media{margin:0 -44px 0;background:#101317;overflow:hidden}.article-media img{display:block;width:100%;max-height:680px;object-fit:contain;background:#101317}.article-media video{display:block;width:100%;max-height:680px;background:#050607}.article-media iframe{display:block;width:100%;aspect-ratio:16/9;border:0;background:#050607}.media-error{padding:38px 20px;text-align:center;color:#aeb6bf;background:#101317}
.article-content{padding:34px 4px 0;color:#343a40;font-size:1.08rem;line-height:1.82;overflow-wrap:anywhere}.article-content p{margin:0 0 1.05em}.article-content p:last-child{margin-bottom:0}
.stats-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:32px;padding-top:22px;border-top:1px solid var(--border)}.stat-item{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:43px;padding:8px 15px;border:1px solid var(--border);border-radius:13px;background:#fff;color:#56606a;font:600 .88rem inherit;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}.stat-item:hover{transform:translateY(-2px);box-shadow:var(--shadow-soft);border-color:#d6dce2}.stat-item:active{transform:translateY(0)}.whatsapp-stat{background:var(--green)!important;border-color:var(--green)!important;color:#fff!important;box-shadow:0 6px 18px rgba(37,211,102,.20)}
.comments-section{margin-top:30px;background:linear-gradient(180deg,#fff,#fbfcfd);border:1px solid var(--border);border-radius:20px;padding:25px 26px;box-shadow:var(--shadow-soft)}.comments-section h2{display:flex;align-items:center;gap:9px;margin:0 0 17px;font-size:1.12rem;color:var(--primary);font-weight:800}.comments-section h2:before{content:"";width:5px;height:20px;border-radius:5px;background:var(--gold)}.comment-item{padding:15px 0;border-bottom:1px solid var(--border)}.comment-item:last-child{border-bottom:0}.comment-author{font-weight:750;color:var(--primary);font-size:.9rem}.comment-text{margin-top:5px;color:#41474d;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.comment-date{margin-top:6px;color:var(--muted);font-size:.74rem}.comment-form{display:flex;gap:9px;margin-top:18px}.comment-form input{min-width:0;flex:1;padding:12px 14px;border:1px solid #dfe4e8;border-radius:13px;background:#fff;color:var(--text);font:inherit;outline:none;transition:border-color .18s,box-shadow .18s}.comment-form input:focus{border-color:#9aa9b7;box-shadow:0 0 0 4px rgba(52,73,94,.08)}.comment-form button{border:0;border-radius:13px;padding:11px 18px;background:var(--primary);color:#fff;font-weight:700;cursor:pointer;transition:transform .18s,box-shadow .18s}.comment-form button:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(44,62,80,.20)}.comment-form button:disabled{opacity:.6;cursor:wait;transform:none}
.loading-state,.error-message{box-sizing:border-box;width:100%;padding:50px 25px;text-align:center;background:#fff;border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow-soft);color:var(--muted)}.error-message{color:var(--danger)}
@media(max-width:600px){#aviso-container{width:calc(100% - 16px);padding:12px 0 38px}.aviso-paper{border-radius:19px}.article-header{padding:27px 21px 24px}.article-header:after{left:21px}.article-title{font-size:clamp(1.65rem,8vw,2.25rem)!important;letter-spacing:-.025em}.article-meta{gap:7px 14px;font-size:.8rem}.article-body{padding:0 21px 24px}.article-media{margin:0 -21px}.article-media img{max-height:500px}.article-content{padding-top:25px;font-size:1rem;line-height:1.72}.stats-row{gap:7px;margin-top:25px;padding-top:18px}.stat-item{min-height:40px;padding:7px 11px;font-size:.8rem;border-radius:11px}.comments-section{margin-top:24px;padding:20px 17px;border-radius:17px}.comment-form{flex-direction:column}.comment-form button{width:100%}}
</style>
</head>
<body>
<div id="header-container"></div>
<div id="aviso-container"><div class="loading-state">Cargando aviso...</div></div>
<script src="/js/api.js"></script><script src="/js/ui.js"></script><script src="/js/auth.js"></script>
<script>
const AVISO_ID=new URLSearchParams(location.search).get('id');
const AVISO_SUPABASE_URL='https://gnjaumpjerbbwlkcgxqa.supabase.co';
const AVISO_SUPABASE_PUBLISHABLE_KEY='sb_publishable_x01F_xzyh5b-sZdwhKh6FQ_OzQVxMpN';
let avisoActual=null;let usuarioActual=null;let supabaseAvisoClient=null;
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\\"/g,'&quot;').replace(/'/g,'&#039;')}
function fecha(v){if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'})}
function url(v){const s=String(v??'').trim();if(!s)return '';if(/^https?:\/\//i.test(s)||s.startsWith('/')||s.startsWith('./'))return s;return ''}
function yt(v){try{const u=new URL(v);let id='';if(u.hostname.includes('youtu.be'))id=u.pathname.slice(1);if(u.hostname.includes('youtube.com'))id=u.searchParams.get('v')||u.pathname.match(/\/embed\/([^/]+)/)?.[1]||u.pathname.match(/\/shorts\/([^/]+)/)?.[1]||'';return id?'https://www.youtube.com/embed/'+encodeURIComponent(id):''}catch(e){return ''}}
function media(a){const img=url(a.imagen_url||a.imagen||a.image_url||a.foto_url||a.foto);const vid=url(a.video_url||a.video||a.video_url_publico||a.videoUrl);if(!img&&!vid)return '';let h='<div class="article-media">';if(img)h+='<img src="'+esc(img)+'" alt="Imagen del aviso" loading="eager" referrerpolicy="no-referrer" onerror="this.outerHTML=\'<div class=\"media-error\">No fue posible cargar la imagen del aviso.</div>\'">';if(vid){const e=yt(vid);h+=e?'<iframe src="'+esc(e)+'" title="Video del aviso" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share" allowfullscreen></iframe>':'<video controls playsinline preload="metadata" src="'+esc(vid)+'" onerror="this.outerHTML=\'<div class=\"media-error\">No fue posible reproducir el video del aviso.</div>\'"></video>'}return h+'</div>'}
async function cargarHeader(){try{const r=await fetch('/common/header.html',{cache:'no-store'});if(!r.ok)throw new Error('No se pudo cargar el encabezado');const html=await r.text();const doc=new DOMParser().parseFromString(html,'text/html');const target=document.getElementById('header-container');target.innerHTML='';doc.body.childNodes.forEach(n=>target.appendChild(document.importNode(n,true)));doc.head.querySelectorAll('style').forEach(s=>document.head.appendChild(document.importNode(s,true)));doc.querySelectorAll('script').forEach(old=>{const s=document.createElement('script');for(const a of old.attributes)s.setAttribute(a.name,a.value);s.textContent=old.textContent;document.body.appendChild(s)})}catch(e){console.warn('Header:',e)}}
async function getSupabaseAvisoClient(){if(supabaseAvisoClient)return supabaseAvisoClient;if(!window.supabase){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=resolve;s.onerror=()=>reject(new Error('No se pudo cargar Supabase JS'));document.head.appendChild(s)})}supabaseAvisoClient=window.supabase.createClient(AVISO_SUPABASE_URL,AVISO_SUPABASE_PUBLISHABLE_KEY);return supabaseAvisoClient}
async function comentarios(id){const l=document.getElementById('comments-list');if(!l)return;try{const client=await getSupabaseAvisoClient();const {data,error}=await client.from('comentarios').select('id,aviso_id,usuario_id,nombre_autor,contenido,created_at').eq('aviso_id',id).order('created_at',{ascending:true});if(error)throw error;l.innerHTML=data?.length?data.map(c=>'<div class="comment-item"><div class="comment-author">'+esc(c.nombre_autor||'Anónimo')+'</div><div class="comment-text">'+esc(c.contenido||'')+'</div><div class="comment-date">'+esc(fecha(c.created_at))+'</div></div>').join(''):'<div style="text-align:center;color:#888;padding:8px 0">No hay comentarios aún. ¡Sé el primero!</div>';const count=document.querySelector('.comments-count');if(count)count.textContent=String(data?.length||0)}catch(e){console.error('Comentarios:',e);l.innerHTML='<div style="text-align:center;color:#888;padding:8px 0">No fue posible cargar los comentarios.</div>'}}
function render(){const a=avisoActual;if(!a)return;const autor=a.nombre_autor||a.autor_nombre||a.nombre_usuario||'Vecino',titulo=a.titulo||a.nombre||'Aviso',desc=a.descripcion||a.contenido||a.texto||'',cat=a.categoria||'General',f=a.created_at||a.fecha||a.timestamp,numero=a.telefono||'',id=a.id||AVISO_ID;let h='<article class="aviso-paper"><header class="article-header"><span class="article-category">'+esc(cat)+'</span><h1 class="article-title">'+esc(titulo)+'</h1><div class="article-meta"><span>👤 '+esc(autor)+'</span><span>📅 '+esc(fecha(f))+'</span><span>👁️ <span class="vistas-count">'+Number(a.vistas||a.visitas||0)+'</span></span></div></header><div class="article-body">'+media(a)+'<div class="article-content">'+desc.split(/\n+/).filter(Boolean).map(p=>'<p>'+esc(p)+'</p>').join('')+'</div><div class="stats-row"><button class="stat-item" onclick="darLike(\''+esc(id)+'\')">👍 <span class="likes-count">'+Number(a.likes||0)+'</span></button><button class="stat-item" onclick="darDislike(\''+esc(id)+'\')">👎 <span class="dislikes-count">'+Number(a.dislikes||0)+'</span></button><button class="stat-item" onclick="abrirComentarios()">💬 <span class="comments-count">'+Number(a.comments_count||a.comentarios||0)+'</span></button>';if(numero)h+='<button class="stat-item whatsapp-stat" onclick="handleWhatsAppClick(\''+esc(numero)+'\',\''+esc('Hola, vi tu aviso "'+titulo+'" en EL BARRIO')+'\',event)">WhatsApp</button>';h+='</div><section class="comments-section" id="comments-section"><h2>Comentarios</h2><div id="comments-list">Cargando comentarios...</div><div class="comment-form"><input id="nuevo-comentario" maxlength="500" autocomplete="off" placeholder="Escribe un comentario..."><button id="btn-publicar-comentario" type="button" onclick="publicarComentario()">Publicar</button></div></section></div></article>';document.getElementById('aviso-container').innerHTML=h;comentarios(id)}
async function cargar(){const c=document.getElementById('aviso-container');if(!AVISO_ID){c.innerHTML='<div class="error-message">No se proporcionó el ID del aviso.</div>';return}try{const r=await API.peticion('OBTENER_AVISO_POR_ID',{id:AVISO_ID});if(!r?.success||!r.data)throw new Error(r?.error||'No se encontró el aviso.');avisoActual=r.data;render();if(typeof API.registrarVista==='function')API.registrarVista(AVISO_ID).catch(console.warn)}catch(e){console.error('Aviso:',e);c.innerHTML='<div class="error-message">No fue posible cargar este aviso.</div>'}}
async function darLike(id){if(typeof API.darLike!=='function')return;try{const r=await API.darLike(id);if(r?.success!==false){const e=document.querySelector('.likes-count');if(e)e.textContent=Number(e.textContent||0)+1}}catch(e){console.error(e)}}
async function darDislike(id){if(typeof API.darDislike!=='function')return;try{const r=await API.darDislike(id);if(r?.success!==false){const e=document.querySelector('.dislikes-count');if(e)e.textContent=Number(e.textContent||0)+1}}catch(e){console.error(e)}}
function abrirComentarios(){document.getElementById('comments-section')?.scrollIntoView({behavior:'smooth'})}
async function publicarComentario(){const i=document.getElementById('nuevo-comentario'),t=i?.value.trim(),btn=document.getElementById('btn-publicar-comentario');if(!t)return;try{if(!usuarioActual&&window.Auth?.requireAuth)usuarioActual=await Auth.requireAuth();if(!usuarioActual){alert('Inicia sesión para publicar un comentario.');return}if(!usuarioActual.id)throw new Error('No se pudo identificar al usuario.');if(btn)btn.disabled=true;const client=await getSupabaseAvisoClient();const payload={aviso_id:AVISO_ID,usuario_id:usuarioActual.id,nombre_autor:usuarioActual.nombre||usuarioActual.email||'Usuario',contenido:t};const {error}=await client.from('comentarios').insert(payload);if(error)throw error;i.value='';await comentarios(AVISO_ID)}catch(e){console.error('Publicar comentario:',e);alert(e?.message||'No fue posible publicar el comentario.')}finally{if(btn)btn.disabled=false}}
function normalizarTelefono(numero){let n=String(numero||'').replace(/\D/g,'');if(n.startsWith('521')&&n.length===13)n='52'+n.slice(3);else if(n.length===10)n='52'+n;return n}
async function handleWhatsAppClick(numero,mensaje,event){event?.stopPropagation();const n=normalizarTelefono(numero);if(!n)return;try{if(typeof API.registrarClickWhatsApp==='function')await API.registrarClickWhatsApp(AVISO_ID)}catch(e){console.warn('Registro de click WhatsApp:',e)}window.open('https://wa.me/'+n+'?text='+encodeURIComponent(mensaje||'Hola'),'_blank','noopener,noreferrer')}
window.darLike=darLike;window.darDislike=darDislike;window.abrirComentarios=abrirComentarios;window.publicarComentario=publicarComentario;window.handleWhatsAppClick=handleWhatsAppClick;
document.addEventListener('DOMContentLoaded',()=>{cargarHeader();cargar()});
</script>
</body>
</html>
