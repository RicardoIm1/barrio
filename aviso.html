<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Aviso - EL BARRIO</title>
<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="/css/estilo.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2c3e50">
<style>
:root{--bg:#f5f5f5;--card:#fff;--text:#1c1c1e;--muted:#737373;--border:#e8e8ec;--primary:#2c3e50;--green:#25D366;--danger:#dc3545;--shadow:0 10px 35px rgba(0,0,0,.08)}
html,body{margin:0;min-height:100%}body{background:var(--bg)!important;color:var(--text)!important;padding:0!important;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif!important}
#aviso-container{width:min(900px,calc(100% - 32px));margin:auto;padding:36px 0 56px}.aviso-paper{display:block;background:#fff;border:1px solid var(--border);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.article-header{padding:34px 38px 25px;background:linear-gradient(135deg,#fff,#fafafa);border-bottom:1px solid var(--border)}.article-category{display:inline-flex;padding:6px 13px;border-radius:999px;background:rgba(245,176,66,.14);color:#9a6710;border:1px solid rgba(245,176,66,.25);font-size:.76rem;font-weight:700;text-transform:uppercase}.article-title{margin:14px 0 12px!important;color:var(--primary)!important;font-size:clamp(1.8rem,4vw,2.65rem)!important;line-height:1.12!important;font-weight:750!important}.article-meta{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:.88rem}.article-meta span{display:inline-flex;align-items:center;gap:4px}
.article-body{padding:0 38px 30px}.article-media{margin:0 -38px 30px;background:#111;overflow:hidden}.article-media img{display:block;width:100%;max-height:650px;object-fit:contain;background:#111}.article-media video{display:block;width:100%;max-height:650px;background:#000}.article-media iframe{display:block;width:100%;aspect-ratio:16/9;border:0;background:#000}.media-caption{padding:9px 15px;color:#aaa;background:#111;text-align:center;font-size:.75rem}.media-error{display:none}
.article-content{padding-top:30px;color:#303035;font-size:1.08rem;line-height:1.78;overflow-wrap:anywhere}.article-content p{margin:0 0 1em}.stats-row{display:flex;flex-wrap:wrap;gap:9px;margin-top:30px;padding-top:20px;border-top:1px solid var(--border)}.stat-item{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:8px 14px;border:1px solid var(--border);border-radius:999px;background:#fff;color:#555;font:inherit;cursor:pointer}.stat-item:hover{box-shadow:0 5px 14px rgba(0,0,0,.08)}.stat-value{font-weight:650}.whatsapp-stat{background:var(--green)!important;border-color:var(--green)!important;color:#fff!important}
.comments-section{margin-top:28px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px}.comments-section h2{margin:0 0 15px;font-size:1.05rem;color:var(--primary)}.comment-item{padding:13px 0;border-bottom:1px solid var(--border)}.comment-author{font-weight:700;color:var(--primary);font-size:.88rem}.comment-text{margin-top:4px;color:#444;line-height:1.5}.comment-date{margin-top:5px;color:var(--muted);font-size:.74rem}.comment-form{display:flex;gap:8px;margin-top:16px}.comment-form input{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:12px;font:inherit}.comment-form button{border:0;border-radius:12px;padding:10px 15px;background:var(--primary);color:#fff;cursor:pointer}.loading-state,.error-message{box-sizing:border-box;width:100%;padding:45px 25px;text-align:center;background:#fff;border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);color:var(--muted)}.error-message{color:var(--danger)}
@media(max-width:600px){#aviso-container{width:calc(100% - 18px);padding:10px 0 30px}.aviso-paper{border-radius:17px}.article-header{padding:25px 20px 20px}.article-title{font-size:1.65rem!important}.article-body{padding:0 20px 22px}.article-media{margin:0 -20px 22px}.article-media img{max-height:480px}.article-content{padding-top:23px;font-size:1rem}.stats-row{gap:7px;margin-top:24px}.stat-item{min-height:40px;padding:7px 11px;font-size:.82rem}.comment-form{flex-direction:column}}
</style>
</head>
<body>
<div id="aviso-container"><div class="loading-state">Cargando aviso...</div></div>
<script src="/js/api.js"></script><script src="/js/ui.js"></script><script src="/js/auth.js"></script>
<script>
const AVISO_ID=new URLSearchParams(location.search).get('id');let avisoActual=null;let usuarioActual=null;
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;')}
function fecha(v){if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'})}
function url(v){const s=String(v??'').trim();return /^https?:\/\//i.test(s)?s:''}
function yt(v){try{const u=new URL(v);let id='';if(u.hostname.includes('youtu.be'))id=u.pathname.slice(1);if(u.hostname.includes('youtube.com'))id=u.searchParams.get('v')||u.pathname.match(/\/embed\/([^/]+)/)?.[1]||u.pathname.match(/\/shorts\/([^/]+)/)?.[1]||'';return id?'https://www.youtube.com/embed/'+encodeURIComponent(id):''}catch(e){return ''}}
function media(a){const img=url(a.imagen_url||a.imagen||a.image_url||a.foto_url||a.foto);const vid=url(a.video_url||a.video||a.video_url_publico||a.videoUrl);if(!img&&!vid)return '';let h='<div class="article-media">';if(img)h+='<img src="'+esc(img)+'" alt="Imagen del aviso" loading="eager" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'">';if(vid){const e=yt(vid);h+=e?'<iframe src="'+esc(e)+'" title="Video del aviso" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share" allowfullscreen></iframe>':'<video controls playsinline preload="metadata" src="'+esc(vid)+'"></video>'}return h+'<div class="media-caption">Contenido multimedia del aviso</div></div>'}
async function comentarios(id){const l=document.getElementById('comments-list');if(!l)return;try{const r=await API.peticion('LISTAR_COMENTARIOS',{avisoId:id},localStorage.getItem('api_key'));if(!r?.success){l.innerHTML='<div style="text-align:center;color:#888">Inicia sesión para ver y publicar comentarios.</div>';return}const a=Array.isArray(r.data)?r.data:(Array.isArray(r.datos)?r.datos:[]);l.innerHTML=a.length?a.map(c=>'<div class="comment-item"><div class="comment-author">'+esc(c.autor||c.usuario_nombre||c.usuario_email||'Anónimo')+'</div><div class="comment-text">'+esc(c.texto||c.comentario||c.contenido||'')+'</div><div class="comment-date">'+esc(fecha(c.fecha||c.created_at||c.timestamp||c.fechacreacion))+'</div></div>').join(''):'<div style="text-align:center;color:#888">No hay comentarios aún. ¡Sé el primero!</div>'}catch(e){console.error('Comentarios:',e);l.innerHTML='<div style="text-align:center;color:#888">No fue posible cargar los comentarios.</div>'}}
function render(){const a=avisoActual;if(!a)return;const autor=a.nombre_autor||a.autor_nombre||a.nombre_usuario||'Vecino',titulo=a.titulo||a.nombre||'Aviso',desc=a.descripcion||a.contenido||a.texto||'',cat=a.categoria||'General',f=a.created_at||a.fecha||a.timestamp,numero=a.telefono||a.whatsapp||a.contacto||'',id=a.id||AVISO_ID;let h='<article class="aviso-paper"><header class="article-header"><span class="article-category">'+esc(cat)+'</span><h1 class="article-title">'+esc(titulo)+'</h1><div class="article-meta"><span>👤 '+esc(autor)+'</span><span>📅 '+esc(fecha(f))+'</span><span>👁️ <span class="vistas-count">'+Number(a.vistas||a.visitas||0)+'</span></span></div></header><div class="article-body">'+media(a)+'<div class="article-content">'+desc.split(/\n+/).filter(Boolean).map(p=>'<p>'+esc(p)+'</p>').join('')+'</div><div class="stats-row"><button class="stat-item" onclick="darLike(\''+esc(id)+'\')">👍 <span class="likes-count">'+Number(a.likes||0)+'</span></button><button class="stat-item" onclick="darDislike(\''+esc(id)+'\')">👎 <span class="dislikes-count">'+Number(a.dislikes||0)+'</span></button><button class="stat-item" onclick="abrirComentarios()">💬 <span class="comments-count">'+Number(a.comments_count||a.comentarios||0)+'</span></button>';if(numero)h+='<button class="stat-item whatsapp-stat" onclick="handleWhatsAppClick(\''+esc(numero)+'\',\''+esc('Hola, vi tu aviso "'+titulo+'" en EL BARRIO')+'\',event)">WhatsApp</button>';h+='</div><section class="comments-section" id="comments-section"><h2>Comentarios</h2><div id="comments-list">Cargando comentarios...</div><div class="comment-form"><input id="nuevo-comentario" maxlength="500" placeholder="Escribe un comentario..."><button type="button" onclick="publicarComentario()">Publicar</button></div></section></div></article>';document.getElementById('aviso-container').innerHTML=h;comentarios(id)}
async function cargar(){const c=document.getElementById('aviso-container');if(!AVISO_ID){c.innerHTML='<div class="error-message">No se proporcionó el ID del aviso.</div>';return}try{const r=await API.peticion('OBTENER_AVISO_POR_ID',{id:AVISO_ID});if(!r?.success||!r.data)throw new Error(r?.error||'No se encontró el aviso.');avisoActual=r.data;render();if(typeof API.registrarVista==='function')API.registrarVista(AVISO_ID).catch(console.warn)}catch(e){console.error('Aviso:',e);c.innerHTML='<div class="error-message">No fue posible cargar este aviso.</div>'}}
async function darLike(id){if(typeof API.darLike!=='function')return;try{const r=await API.darLike(id);if(r?.success!==false){const e=document.querySelector('.likes-count');if(e)e.textContent=Number(e.textContent||0)+1}}catch(e){console.error(e)}}
async function darDislike(id){if(typeof API.darDislike!=='function')return;try{const r=await API.darDislike(id);if(r?.success!==false){const e=document.querySelector('.dislikes-count');if(e)e.textContent=Number(e.textContent||0)+1}}catch(e){console.error(e)}}
function abrirComentarios(){document.getElementById('comments-section')?.scrollIntoView({behavior:'smooth'})}
async function publicarComentario(){const i=document.getElementById('nuevo-comentario'),t=i?.value.trim();if(!t)return;try{if(!usuarioActual&&window.Auth?.requireAuth)usuarioActual=await Auth.requireAuth();if(!usuarioActual){alert('Inicia sesión para publicar un comentario.');return}if(typeof API.agregarComentario!=='function')throw new Error('La función de comentarios no está disponible.');await API.agregarComentario(AVISO_ID,t,usuarioActual.nombre||usuarioActual.email||'Usuario');i.value='';comentarios(AVISO_ID)}catch(e){console.error(e);alert(e?.message||'No fue posible publicar el comentario.')}}
function handleWhatsAppClick(numero,mensaje,event){event?.stopPropagation();const n=String(numero||'').replace(/\D/g,'');if(n)window.open('https://wa.me/'+n+'?text='+encodeURIComponent(mensaje||'Hola'),'_blank','noopener,noreferrer')}
window.darLike=darLike;window.darDislike=darDislike;window.abrirComentarios=abrirComentarios;window.publicarComentario=publicarComentario;window.handleWhatsAppClick=handleWhatsAppClick;document.addEventListener('DOMContentLoaded',cargar);
</script>
</body>
</html>
