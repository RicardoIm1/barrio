<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:radial-gradient(circle at 50% -10%,rgba(52,73,94,.09),transparent 35%),var(--bg)!important;color:var(--text)!important;padding:0!important;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif!important}
#header-container{width:100%}#aviso-container{width:min(920px,calc(100% - 32px));margin:auto;padding:34px 0 70px}.aviso-paper{background:rgba(255,255,255,.97);border:1px solid rgba(231,234,238,.95);border-radius:26px;overflow:hidden;box-shadow:var(--shadow)}
.article-header{position:relative;padding:38px 44px 30px;background:linear-gradient(135deg,#fff,#f5f8fa);border-bottom:1px solid var(--border)}.article-header:after{content:"";position:absolute;left:44px;bottom:-1px;width:76px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--gold),#f0c66d)}.article-category{display:inline-flex;padding:7px 13px;border-radius:999px;background:rgba(212,160,67,.12);color:#8d651e;border:1px solid rgba(212,160,67,.25);font-size:.73rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.article-title{max-width:780px;margin:15px 0 14px!important;color:var(--primary)!important;font-size:clamp(2rem,5vw,3rem)!important;line-height:1.08!important;letter-spacing:-.035em;font-weight:800!important}.article-meta{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--muted);font-size:.88rem}.article-meta span{display:inline-flex;align-items:center;gap:5px}
.article-body{padding:0 44px 36px}.article-media{background:#101317;overflow:hidden}.article-media-image{margin:0 -44px}.article-media-image img{display:block;width:100%;max-height:680px;object-fit:contain;background:#101317}.article-media-video{min-width:0;border-radius:16px}.article-media video{display:block;width:100%;max-height:680px;aspect-ratio:16/9;object-fit:contain;background:#050607}.article-media iframe{display:block;width:100%;aspect-ratio:16/9;border:0;background:#050607}.article-media-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start;padding-top:24px}.article-media-layout.tiene-miniatura{grid-template-columns:112px minmax(0,1fr)}.article-media-thumb{display:block;position:relative;overflow:hidden;border-radius:12px;border:1px solid var(--border);background:#eef1f4;aspect-ratio:3/4}.article-media-thumb img{display:block;width:100%;height:100%;object-fit:cover}.article-content{padding:34px 4px 0;color:#343a40;font-size:1.08rem;line-height:1.82;overflow-wrap:anywhere}.article-content.texto-largo{column-count:2;column-gap:36px;column-rule:1px solid var(--border);text-align:left}.article-content p{margin:0 0 1.05em;break-inside:avoid}.article-content p:last-child{margin-bottom:0}
.stats-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:32px;padding-top:22px;border-top:1px solid var(--border)}.stat-item{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:43px;padding:8px 15px;border:1px solid var(--border);border-radius:13px;background:#fff;color:#56606a;font:600 .88rem inherit;cursor:pointer;transition:.18s}.stat-item:hover{transform:translateY(-2px);box-shadow:var(--shadow-soft);border-color:#d6dce2}.stat-item:disabled{opacity:.55;cursor:wait}.stat-item.voted{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,160,67,.12)}.stat-item.metric{cursor:default;background:#f8fafb}.stat-item.metric:hover{transform:none;box-shadow:none;border-color:var(--border)}.interacciones-stat{font-weight:750;color:var(--primary);background:linear-gradient(135deg,#f8fafb,#fff)!important}.whatsapp-stat{background:var(--green)!important;border-color:var(--green)!important;color:#fff!important}.whatsapp-admin{background:var(--primary)!important;border-color:var(--primary)!important;color:#fff!important}
.comments-section{margin-top:30px;background:linear-gradient(180deg,#fff,#fbfcfd);border:1px solid var(--border);border-radius:20px;padding:25px 26px;box-shadow:var(--shadow-soft)}.comments-section h2{display:flex;align-items:center;gap:9px;margin:0 0 17px;font-size:1.12rem;color:var(--primary);font-weight:800}.comments-section h2:before{content:"";width:5px;height:20px;border-radius:5px;background:var(--gold)}.comment-item{padding:15px 0;border-bottom:1px solid var(--border)}.comment-item:last-child{border-bottom:0}.comment-author{font-weight:750;color:var(--primary);font-size:.9rem}.comment-author.privado{filter:blur(5px);user-select:none;pointer-events:none}.comment-author.autor-visible{filter:none;user-select:text;pointer-events:auto}.comment-text{margin-top:5px;color:#41474d;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.comment-date{margin-top:6px;color:var(--muted);font-size:.74rem}.comment-form{display:flex;gap:9px;margin-top:18px}.comment-form input{min-width:0;flex:1;padding:12px 14px;border:1px solid #dfe4e8;border-radius:13px;background:#fff;color:var(--text);font:inherit;outline:none}.comment-form input:focus{border-color:#9aa9b7;box-shadow:0 0 0 4px rgba(52,73,94,.08)}.comment-form button{border:0;border-radius:13px;padding:11px 18px;background:var(--primary);color:#fff;font-weight:700;cursor:pointer}.loading-state,.error-message{width:100%;padding:50px 25px;text-align:center;background:#fff;border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow-soft);color:var(--muted)}.error-message{color:var(--danger)}
@media(min-width:601px) and (max-width:900px){#aviso-container{width:calc(100% - 28px)}.article-header{padding-left:30px;padding-right:30px}.article-body{padding-left:30px;padding-right:30px}.article-media-image{margin-left:-30px;margin-right:-30px}.article-media-layout.tiene-miniatura{grid-template-columns:96px minmax(0,1fr);gap:12px}}@media(max-width:600px){#aviso-container{width:calc(100% - 16px);padding:12px 0 38px}.aviso-paper{border-radius:19px}.article-header{padding:27px 21px 24px}.article-header:after{left:21px}.article-title{font-size:clamp(1.65rem,8vw,2.25rem)!important}.article-meta{gap:7px 14px;font-size:.8rem}.article-body{padding:0 21px 24px}.article-media-image{margin:0 -21px}.article-media-layout{padding-top:16px;gap:9px}.article-media-layout.tiene-miniatura{grid-template-columns:76px minmax(0,1fr)}.article-media-video{border-radius:10px}.article-media-thumb{border-radius:9px}.article-content{padding-top:25px;font-size:1rem;line-height:1.72}.article-content.texto-largo{column-count:1;column-rule:0}.stats-row{gap:7px;margin-top:25px;padding-top:18px}.stat-item{min-height:40px;padding:7px 11px;font-size:.8rem;border-radius:11px}.comment-form{flex-direction:column}.comment-form button{min-height:44px}}
.aviso-autor-privado{display:inline-block;filter:blur(5px);user-select:none;pointer-events:none;opacity:.78;transform:translateZ(0)}

.autor-aviso-link{border:0;padding:0;background:transparent;color:inherit;font:inherit;font-weight:750;text-decoration:underline;text-decoration-color:rgba(212,160,67,.75);text-underline-offset:3px;cursor:pointer}
#editar-aviso-panel{margin-top:18px;padding:20px;border:1px solid #dfe6ec;border-radius:18px;background:#fff;box-shadow:var(--shadow-soft)}
#editar-aviso-panel[hidden]{display:none!important}
#editar-aviso-panel h2{margin:0 0 15px;color:var(--primary);font-size:1.1rem}
.editar-aviso-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.editar-aviso-campo.ancho{grid-column:1/-1}

.editar-aviso-campo input,.editar-aviso-campo textarea{width:100%;min-width:0;padding:11px 12px;border:1px solid #d9e1e8;border-radius:11px;font:inherit;color:#20242a;background:#fff}

#guardar-edicion-aviso{background:var(--primary);color:#fff}

#guardar-edicion-aviso:disabled{opacity:.6;cursor:wait}
.mas-avisos{margin-top:25px;padding:25px;background:#fff;border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow-soft)}
.mas-avisos h2{margin:0 0 6px;color:var(--primary);font-size:1.15rem}
.mas-avisos-intro{margin:0 0 18px;color:var(--muted);font-size:.9rem}
.mas-avisos-lista{display:grid;gap:10px}
.mas-aviso-item{display:grid;grid-template-columns:88px minmax(0,1fr);gap:14px;align-items:center;padding:11px;border:1px solid var(--border);border-radius:15px;color:inherit;text-decoration:none}
.mas-aviso-item:hover{background:#f7f9fb;border-color:#cbd5df}
.mas-aviso-item img,.mas-aviso-item-sin-imagen{width:88px;height:72px;object-fit:cover;border-radius:10px;background:#eef1f4}
.mas-aviso-item-sin-imagen{display:grid;place-items:center;color:#7b8793;font-size:.75rem}
.mas-aviso-item strong{display:block;color:var(--primary);line-height:1.3}
.mas-aviso-item small{display:block;margin-top:5px;color:var(--muted)}
#mas-avisos-sentinel{text-align:center;padding:16px;color:var(--muted);font-size:.85rem}
@media(max-width:600px){#editar-aviso-panel{padding:15px}.editar-aviso-grid{grid-template-columns:1fr}.editar-aviso-campo.ancho{grid-column:auto}.mas-avisos{padding:17px}.mas-aviso-item{grid-template-columns:68px minmax(0,1fr);gap:10px;padding:9px}.mas-aviso-item img,.mas-aviso-item-sin-imagen{width:68px;height:62px}.editar-aviso-acciones button{flex:1}}

</style>

<body>
<div id="header-container"></div>
<div id="aviso-container"><div class="loading-state">Cargando aviso...</div></div>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>

<script>
const AVISO_ID=new URLSearchParams(location.search).get('id');
const WHATSAPP_EL_BARRIO='523222654110';
let avisoActual=null,usuarioActual=null,usuarioAuth=null,masAvisosCursor=null,masAvisosCargando=false,masAvisosFin=false,masAvisosObserver=null;
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function fecha(v){if(!v)return '';const texto=String(v).trim();const valorUTC=/(?:Z|[+-]\d{2}:?\d{2})$/i.test(texto)?texto:texto+'Z';const d=new Date(valorUTC);return Number.isNaN(d.getTime())?texto:d.toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short',timeZone:'America/Bahia_Banderas'})}
function url(v){const s=String(v??'').trim();return /^https?:\/\//i.test(s)||s.startsWith('/')||s.startsWith('./')?s:''}
function yt(v){try{const u=new URL(v);let id='';if(u.hostname.includes('youtu.be'))id=u.pathname.slice(1);if(u.hostname.includes('youtube.com'))id=u.searchParams.get('v')||u.pathname.match(/\/embed\/([^/]+)/)?.[1]||u.pathname.match(/\/shorts\/([^/]+)/)?.[1]||'';return id?'https://www.youtube.com/embed/'+encodeURIComponent(id):''}catch{return ''}}
function media(a){const img=url(a.imagen_url||a.imagen||a.image_url||a.foto_url||a.foto),vid=url(a.video_url||a.video||a.video_url_publico||a.videoUrl);if(!img&&!vid)return '';const embed=vid?yt(vid):'';if(vid){let h='<div class="article-media-layout'+(img?' tiene-miniatura':'')+'">';if(img)h+='<a class="article-media-thumb" href="'+esc(img)+'" target="_blank" rel="noopener noreferrer" aria-label="Abrir imagen del aviso"><img src="'+esc(img)+'" alt="Miniatura del aviso" loading="lazy" decoding="async" referrerpolicy="no-referrer"></a>';h+='<div class="article-media article-media-video">';h+=embed?'<iframe src="'+esc(embed)+'?autoplay=1&mute=1&loop=1&playlist='+encodeURIComponent(embed.split('/').pop())+'&playsinline=1&controls=1" title="Video del aviso" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share" allowfullscreen></iframe>':'<video controls autoplay muted loop playsinline preload="metadata" src="'+esc(vid)+'"></video>';h+='</div></div>';return h}return img?'<div class="article-media article-media-image"><img src="'+esc(img)+'" alt="Imagen del aviso" loading="eager" decoding="async" fetchpriority="high" referrerpolicy="no-referrer"></div>':''}
function normalizarTelefono(v){let n=String(v??'').replace(/\D/g,'');if(n.startsWith('00'))n=n.slice(2);if(n.startsWith('52'))return n;if(n.length===10)return '52'+n;return n}
function abrirWhatsApp(numero,mensaje){const n=normalizarTelefono(numero);if(!n){alert('El aviso no tiene un número de WhatsApp válido.');return}window.open('https://wa.me/'+n+'?text='+encodeURIComponent(mensaje),'_blank','noopener,noreferrer')}
function contactarAnunciante(){const a=avisoActual;if(!a)return;const numero=a.telefono||a.contacto||'';abrirWhatsApp(numero,'Hola, vi tu aviso "'+(a.titulo||a.nombre||'Aviso')+'" en EL BARRIO y me gustaría obtener más información.')}
function contactarElBarrio(){const a=avisoActual;if(!a)return;abrirWhatsApp(WHATSAPP_EL_BARRIO,'Hola, vi el aviso "'+(a.titulo||a.nombre||'Aviso')+'" en EL BARRIO y quiero ponerme en contacto con El Barrio.')}
function actualizarMetricas(){const a=avisoActual||{};const likes=Number(a.likes??a.votos_positivos??0),dislikes=Number(a.dislikes??a.votos_negativos??0),comentariosCount=Number(a.comments_count??a.comentarios??0);const interacciones=likes+dislikes+comentariosCount;const v=document.querySelector('.vistas-count');if(v)v.textContent=Number(a.vistas??a.visitas??a.visualizaciones??0);const i=document.querySelector('.interacciones-count');if(i)i.textContent=interacciones;const l=document.querySelector('.likes-count');if(l)l.textContent=likes;const d=document.querySelector('.dislikes-count');if(d)d.textContent=dislikes;const c=document.querySelector('.comments-count');if(c)c.textContent=comentariosCount}
async function registrarVistaYActualizar(id){try{if(typeof API.registrarVista!=='function')return;const r=await API.registrarVista(id);const valor=Number(r?.vistas??r?.visualizaciones??r?.views??r?.data?.vistas??NaN);if(Number.isFinite(valor)){avisoActual.vistas=valor;actualizarMetricas();try{localStorage.setItem('elbarrio_vista_actualizada',JSON.stringify({id:String(id),vistas:valor,at:Date.now()}))}catch(_){}}}catch(e){console.warn('Vista:',e)}}
async function cargarHeader(){
    try{
        const r=await fetch('/common/header.html',{cache:'no-store'});
        if(!r.ok) throw Error('No se pudo cargar el encabezado');

        const html=await r.text();
        const doc=new DOMParser().parseFromString(html,'text/html');
        const target=document.getElementById('header-container');

        target.innerHTML='';

        doc.body.childNodes.forEach(n=>{
            target.appendChild(document.importNode(n,true));
        });

        doc.head.querySelectorAll('style').forEach(s=>{
            document.head.appendChild(document.importNode(s,true));
        });

        doc.querySelectorAll('script').forEach(old=>{
            const s=document.createElement('script');

            // CORRECCIÓN: usar el valor del atributo, no el objeto Attr
            for(const a of old.attributes){
                s.setAttribute(a.name,a.value);
            }

            s.textContent=old.textContent;
            document.body.appendChild(s);
        });
        await actualizarHeaderUsuario();

    }catch(e){
        console.warn('Header:',e);
    }
}
async function actualizarHeaderUsuario(){
 try{
  const c=await getSharedClient(),r=await c.auth.getUser(),u=r?.data?.user;
  usuarioAuth=u||null;if(!u)return;
  let p=null;try{const q=await c.from('usuarios').select('id,email,nombre,rol').eq('id',u.id).maybeSingle();if(!q.error)p=q.data}catch(_){}
  usuarioActual={...(usuarioActual||{}),...(p||{}),id:u.id,email:p?.email||u.email,nombre:p?.nombre||u.user_metadata?.nombre||u.user_metadata?.name||u.email?.split('@')[0]||'Usuario',rol:p?.rol||u.app_metadata?.rol||'usuario'};
  try{localStorage.setItem('usuario',JSON.stringify(usuarioActual))}catch(_){}
  const name=document.getElementById('user-name'),area=document.getElementById('user-area'),login=document.getElementById('login-link');
  if(name){name.textContent='👋 '+usuarioActual.nombre;name.style.display='inline-flex';name.title=esPropietarioAviso()?'Editar este aviso':(usuarioActual.rol==='admin'?'Abrir panel de administración':'Abrir perfil');name.onclick=function(e){e.preventDefault();if(esPropietarioAviso())abrirEdicionAviso();else if(usuarioActual.rol==='admin')location.href='/admin.html';else location.href='/perfil.html'};name.style.cursor='pointer'}
  if(area)area.style.display='flex';if(login)login.style.display='none';
 }catch(e){console.warn('No se pudo sincronizar el usuario del encabezado:',e)}
}
function esPropietarioAviso(){return !!(usuarioAuth?.id&&avisoActual?.created_by&&String(usuarioAuth.id)===String(avisoActual.created_by))}
async function getSharedClient(){if(typeof getSupabaseClient==='function')return await getSupabaseClient();throw Error('Cliente Supabase no disponible')}
async function obtenerSesionActiva(){try{const c=await getSharedClient();const r=await c.auth.getSession();return !!r?.data?.session?.user}catch(_){return false}}
async function comentarios(id){const l=document.getElementById('comments-list');if(!l)return;try{const c=await getSharedClient(),r=await c.from('comentarios').select('id,aviso_id,usuario_id,nombre_autor,contenido,created_at').eq('aviso_id',id).order('created_at',{ascending:true});if(r.error)throw r.error;const d=r.data||[];const sesion=await obtenerSesionActiva();l.innerHTML=d.length?d.map(x=>'<div class="comment-item"><div class="comment-author privado'+(sesion?' autor-visible':'')+'">'+esc(x.nombre_autor||'Anónimo')+'</div><div class="comment-text">'+esc(x.contenido||'')+'</div><div class="comment-date">'+esc(fecha(x.created_at))+'</div></div>').join(''):'<div style="text-align:center;color:#888;padding:8px 0">No hay comentarios aún. ¡Sé el primero!</div>';avisoActual.comments_count=d.length;actualizarMetricas()}catch(e){console.error('Comentarios:',e);l.innerHTML='<div style="text-align:center;color:#888;padding:8px 0">No fue posible cargar los comentarios.</div>'}}
async function render(){const a=avisoActual;if(!a)return;const sesion=await obtenerSesionActiva();try{const c=await getSharedClient(),u=await c.auth.getUser();usuarioAuth=u?.data?.user||null}catch(_){}const autor=a.nombre_autor||a.autor_nombre||a.nombre_usuario||'Usuario',titulo=a.titulo||a.nombre||'Aviso',desc=a.descripcion||a.contenido||a.texto||'',cat=a.categoria||'General',f=a.created_at||a.fecha||a.timestamp,numero=a.telefono||a.contacto||'',id=a.id||AVISO_ID;const likes=Number(a.likes??a.votos_positivos??0),dislikes=Number(a.dislikes??a.votos_negativos??0),comentariosCount=Number(a.comments_count??a.comentarios??0),interacciones=likes+dislikes+comentariosCount;let h='<article class="aviso-paper"><header class="article-header"><span class="article-category">'+esc(cat)+'</span><h1 class="article-title">'+esc(titulo)+'</h1><div class="article-meta"><span>Autor: '+(esPropietarioAviso()?'<button class="autor-aviso-link" type="button" onclick="abrirEdicionAviso()" title="Editar este aviso">'+esc(autor)+' · Editar</button>':(sesion?esc(autor):'<span class="aviso-autor-privado">'+esc(autor)+'</span>'))+'</span><span>Fecha: '+esc(fecha(f))+'</span></div>'+(esPropietarioAviso()?panelEdicion(a):'')+'</header><div class="article-body">'+media(a)+'<div class="article-content'+(desc.length>=700?' texto-largo':'')+'">'+desc.split(/\n+/).filter(Boolean).map(p=>'<p>'+esc(p)+'</p>').join('')+'</div><div class="stats-row"><span class="stat-item metric">Vistas <span class="vistas-count">'+Number(a.vistas??a.visitas??a.visualizaciones??0)+'</span></span><span class="stat-item metric interacciones-stat">Interacciones <span class="interacciones-count">'+interacciones+'</span></span><button id="btn-like" class="stat-item" type="button" aria-label="Me gusta" title="Me gusta" onclick="darLike(\''+esc(id)+'\')">👍 <span class="likes-count">'+likes+'</span></button><button id="btn-dislike" class="stat-item" type="button" aria-label="No me gusta" title="No me gusta" onclick="darDislike(\''+esc(id)+'\')">👎 <span class="dislikes-count">'+dislikes+'</span></button><button class="stat-item" type="button" onclick="abrirComentarios()">Comentarios <span class="comments-count">'+comentariosCount+'</span></button>';if(numero)h+='<button class="stat-item whatsapp-stat" type="button" onclick="contactarAnunciante()">WhatsApp anunciante</button>';h+='<button class="stat-item whatsapp-admin" type="button" onclick="contactarElBarrio()">WhatsApp El Barrio</button>';h+='</div><section class="comments-section" id="comments-section"><h2>Comentarios</h2><div id="comments-list">Cargando comentarios...</div><div class="comment-form"><input id="nuevo-comentario" maxlength="500" autocomplete="off" placeholder="Escribe un comentario..."><button id="btn-publicar-comentario" type="button" onclick="publicarComentario()">Publicar</button></div></section></div></article>';document.getElementById('aviso-container').innerHTML=h;if(a.created_by){document.getElementById('aviso-container').insertAdjacentHTML('beforeend',bloqueMasAvisos(autor));iniciarMasAvisos(a)}comentarios(id);cargarUsuario();cargarVotoActual(id);actualizarHeaderUsuario()}
async function cargar(){const c=document.getElementById('aviso-container');if(!AVISO_ID){c.innerHTML='<div class="error-message">No se proporcionó el ID del aviso.</div>';return}try{const r=await API.peticion('OBTENER_AVISO_POR_ID',{id:AVISO_ID});if(!r?.success||!r.data)throw Error(r?.error||'No se encontró el aviso.');avisoActual=r.data;render();registrarVistaYActualizar(AVISO_ID)}catch(e){console.error('Aviso:',e);c.innerHTML='<div class="error-message">No fue posible cargar este aviso.</div>'}}
function cargarUsuario(){try{usuarioActual=JSON.parse(localStorage.getItem('usuario')||'null')}catch{usuarioActual=null}}
async function cargarVotoActual(id){try{const c=await getSharedClient(),u=await c.auth.getUser();if(!u?.data?.user)return;const r=await c.from('votos').select('tipo').eq('aviso_id',id).eq('usuario_id',u.data.user.id).maybeSingle();if(r.error)throw r.error;const btn=r.data?.tipo==='positivo'?document.getElementById('btn-like'):r.data?.tipo==='negativo'?document.getElementById('btn-dislike'):null;if(btn)btn.classList.add('voted')}catch(e){console.warn('Voto actual:',e)}}
function abrirComentarios(){document.getElementById('comments-section')?.scrollIntoView({behavior:'smooth',block:'start'})}
async function darLike(id){await votar(id,'positivo')}
async function darDislike(id){await votar(id,'negativo')}
async function votar(id,tipo){const btn=document.getElementById(tipo==='positivo'?'btn-like':'btn-dislike');if(!usuarioActual){alert('Debes iniciar sesión para votar');return}try{if(btn)btn.disabled=true;const r=await API.votarAviso(id,tipo);if(!r?.success)throw Error(r?.error||'No se pudo registrar el voto');const likes=Number(r.positivos??r.likes??0),dislikes=Number(r.negativos??r.dislikes??0);avisoActual.likes=likes;avisoActual.dislikes=dislikes;avisoActual.votos_positivos=likes;avisoActual.votos_negativos=dislikes;document.querySelectorAll('.stat-item').forEach(x=>x.classList.remove('voted'));const elegido=r.tipo||null;const botonElegido=elegido==='positivo'?document.getElementById('btn-like'):elegido==='negativo'?document.getElementById('btn-dislike'):null;if(botonElegido)botonElegido.classList.add('voted');actualizarMetricas()}catch(e){console.error('Voto:',e);alert(e.message||'No se pudo registrar tu voto')}finally{if(btn)btn.disabled=false}}
async function publicarComentario(){const input=document.getElementById('nuevo-comentario');const contenido=input?.value.trim();if(!contenido)return;if(!usuarioActual){alert('Debes iniciar sesión para comentar');return}try{const c=await getSharedClient(),u=await c.auth.getUser();if(!u?.data?.user)throw Error('Debes iniciar sesión para comentar');const nombre=usuarioActual.nombre||usuarioActual.name||'Vecino';const r=await c.from('comentarios').insert({aviso_id:AVISO_ID,usuario_id:u.data.user.id,nombre_autor:nombre,contenido}).select().single();if(r.error)throw r.error;input.value='';await comentarios(AVISO_ID)}catch(e){console.error('Comentario:',e);alert(e.message||'No se pudo publicar el comentario')}}
cargarHeader();cargar();
</script>
