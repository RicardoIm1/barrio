<!DOCTYPE html>
<html lang="es-MX">

<head>
  <meta name="google-site-verification" content="fmtZKP7ZEDNEcmHyx08vsSQn8wVmqfE2WlKtGyBo968" />
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <meta http-equiv="Strict-Transport-Security" content="max-age=31536000; includeSubDomains">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
  <title>Registro | BARRIO</title>
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/css/estilo.css">
  <link rel="stylesheet" href="/css/index2.css?v=20261106-4">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2c3e50">
  <style>
    .registro-container {
      /* max-width: 700px; */
      max-width: 500px;
      margin: 0 auto;
    }

    .registro-header {
      text-align: center;
      margin-bottom: 2rem;
      padding: 2rem 1rem;
      background: linear-gradient(135deg, #1e4620, #2b7a2b);
      border-radius: 1rem;
      color: white;
    }

    .registro-header h1 {
      font-size: 1.6rem;
      margin-bottom: 0.3rem;
    }

    .badge {
      background: #fbbf24;
      color: #1e4620;
      font-size: 0.7rem;
      padding: 0.2rem 0.8rem;
      border-radius: 2rem;
      display: inline-block;
      margin-top: 0.5rem;
    }

    .registro-content {
      background: white;
      border-radius: 1rem;
      padding: 2rem;
      border: 1px solid var(--color-borde);
      margin-bottom: 2rem;
    }

    .campo {
      margin-bottom: 1.2rem;
    }

    .campo label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 0.4rem;
      color: var(--color-primario);
    }

    .campo input,
    .campo select,
    .campo textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid var(--color-borde);
      border-radius: 0.75rem;
      font-size: 0.95rem;
      font-family: inherit;
      background: white;
    }

    .campo input:focus,
    .campo select:focus,
    .campo textarea:focus {
      outline: none;
      border-color: var(--color-acento);
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .ayuda {
      font-size: 0.7rem;
      color: var(--color-texto-claro);
      margin-top: 0.3rem;
    }

    .info-visibilidad {
      background: #f0fdf4;
      border-left: 4px solid #2b7a2b;
      padding: 0.8rem 1rem;
      border-radius: 0.75rem;
      margin: 1rem 0;
      font-size: 0.8rem;
    }

    .checkbox-acuerdo {
      display: flex;
      align-items: flex-start;
      gap: 0.7rem;
      margin: 1.2rem 0;
      cursor: pointer;
    }

    .checkbox-acuerdo input {
      width: 20px;
      height: 20px;
      margin-top: 0.1rem;
      accent-color: var(--color-primario);
    }

    .checkbox-acuerdo label {
      font-size: 0.85rem;
      line-height: 1.4;
      cursor: pointer;
      color: var(--color-texto);
    }

    .btn {
      background: var(--color-primario);
      color: white;
      border: none;
      width: 100%;
      padding: 0.9rem;
      border-radius: 0.75rem;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--color-secundario);
    }

    .btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .mensaje-error {
      background: #fee2e2;
      color: #b91c1c;
      padding: 0.8rem;
      border-radius: 0.75rem;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      border: 1px solid #fecaca;
    }

    .mensaje-exito {
      background: #d1fae5;
      color: #065f46;
      padding: 0.8rem;
      border-radius: 0.75rem;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      border: 1px solid #a7f3d0;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid white;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 0.5rem;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 600px) {
      .registro-content {
        padding: 1.5rem;
      }

      .registro-header h1 {
        font-size: 1.4rem;
      }
    }

    /* La página de registro comparte el mismo marco y alineación que login.html. */
    html, body { min-height: 100%; }
    body.registro-page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    body.registro-page #header-container {
      flex: 0 0 auto;
      width: 100%;
    }
    body.registro-page .registro-main {
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: none;
      margin: 0;
      padding: clamp(1rem, 2.5vh, 2rem) 1rem;
      box-sizing: border-box;
    }
    body.registro-page .registro-container {
      width: 100%;
      max-width: 500px;
      margin: auto;
    }
    body.registro-page .registro-content {
      width: 100%;
      margin: 0;
      padding: 2rem;
      background: #fff;
      border: 1px solid var(--color-borde);
      border-radius: 1rem;
      box-sizing: border-box;
    }
    body.registro-page .campo input,
    body.registro-page .campo select,
    body.registro-page .campo textarea {
      box-sizing: border-box;
      min-height: 2.9rem;
    }
    body.registro-page .registro-password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    body.registro-page .registro-password-wrapper input {
      flex: 1;
      padding-right: 3rem;
    }
    body.registro-page .toggle-password {
      position: absolute;
      right: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 0;
      background: transparent;
      color: #666;
      font-size: 1.1rem;
      cursor: pointer;
      transition: color .2s ease;
    }
    body.registro-page .toggle-password:hover {
      color: var(--color-acento, #3498db);
    }
    body.registro-page .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      min-height: 3.1rem;
      padding: .95rem 1rem;
      border: 0;
      border-radius: .85rem;
      background: linear-gradient(135deg, var(--color-verde), #1e4620);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(43,122,43,.18);
      transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
    }
    body.registro-page .btn:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, var(--color-verde), #1e4620);
      box-shadow: 0 14px 30px rgba(43,122,43,.28);
    }
    body.registro-page .btn:active { transform: translateY(0); }
    body.registro-page .btn:disabled {
      opacity: .7;
      background: #9ca3af;
      cursor: not-allowed;
      transform: none;
    }
    @media (max-width: 600px) {
      body.registro-page .registro-main { padding: 1rem .75rem; }
      body.registro-page .registro-content { padding: 1.5rem; }
    }
  </style>
  <link rel="stylesheet" href="/css/tipografia-global.css?v=20261106-1">
</head>

<body class="registro-page">
  <div id="header-container"></div>

  <main class="contenedor registro-main">
    <div class="registro-container">

      <div class="registro-content" id="formularioRegistro">
        <div id="mensajeGlobal"></div>

        <div class="campo">
          <label>Tu nombre completo *</label>
          <input type="text" id="nombre">
        </div>

        <div class="campo">
          <label>Correo electrónico *</label>
          <input type="email" id="email">
          <div class="ayuda">Lo usarás para iniciar sesión</div>
        </div>

        <div class="campo">
          <label>Contraseña *</label>

          <div class="registro-password-wrapper">
            <input type="password" id="password" placeholder="Mínimo 6 caracteres">
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña">🙉</button>
          </div>
        </div>

        <div class="campo">
          <label>Teléfono o WhatsApp *</label>
          <input type="tel" id="telefono" required pattern="[0-9]{10}" maxlength="10" inputmode="numeric"
            title="Debe contener exactamente 10 dígitos"
            oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,10)">
          <div class="ayuda">10 dígitos, para que los vecinos te contacten por WhatsApp</div>
        </div>

        <div class="campo">
          <label>Código Postal *</label>
          <input type="text" id="direccion" required pattern="\d{5}" maxlength="5"
            title="Debe contener exactamente 5 números"
            oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,5)">
        </div>

        <div class="campo">
          <label>¿Qué oficio o profesión tienes? *</label>
          <select id="oficio" required>
            <option value="" disabled selected>Selecciona una opción</option>
            <option value="Electricista">⚡ Electricista</option>
            <option value="Plomero">🔧 Plomero</option>
            <option value="Carpintero">🪚 Carpintero</option>
            <option value="Mecánico">🚗 Mecánico</option>
            <option value="Estilista">✂️ Estilista</option>
            <option value="Costurera">🧵 Costurera</option>
            <option value="Pintor">🎨 Pintor</option>
            <option value="Albañil">🧱 Albañil</option>
            <option value="Panadero">🍞 Panadero</option>
            <option value="Comida casera">🍲 Comida casera</option>
            <option value="Otro">📝 Otro</option>
          </select>
        </div>

        <div class="campo" id="otroOficioContainer" style="display: none;">
          <label>Escribe tu oficio</label>
          <input type="text" id="otroOficio" placeholder="Ej: Soldador, Afilador...">
        </div>

        <div class="checkbox-acuerdo">
          <input type="checkbox" id="aceptoPrivacidad" required>
          <label for="aceptoPrivacidad">
            Confirmo que tuve a mi disposición y leí el <strong><a href="/privacidad.html" target="_blank" rel="noopener">Aviso de Privacidad Integral</a></strong>.
          </label>
        </div>
        <div class="checkbox-acuerdo">
          <input type="checkbox" id="acepto" required>
          <label for="acepto">
            Acepto el <strong><a href="/confianza.html" target="_blank" rel="noopener">Compromiso de Confianza Vecinal</a></strong>.
          </label>
        </div>

        <button class="btn" id="btnRegistrar">Registrarme</button>
      </div>
    </div>
  </main>

  <script src="/js/api.js?v=20261109-privacy1"></script>
  <script src="/common/header-atmosfera.js?v=20261109-4"></script>
  <script src="/js/ui.js?v=20261110-1"></script>
  <script src="/js/auth.js?v=20261109-privacy1"></script>

  <script>
    // Cargar header y footer
    document.addEventListener('DOMContentLoaded', async function () {

      //hacer visible la contraseña
      const passwordInput = document.getElementById('password');
      const toggleBtn = document.getElementById('togglePassword');

      if (passwordInput && toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          const isHidden = passwordInput.type === 'password';
          passwordInput.type = isHidden ? 'text' : 'password';
          toggleBtn.textContent = isHidden ? '🙈' : '🙉';
        });
      }

      // Header compartido: misma identidad visual, sesión y menú que el resto del sitio.
      if (window.UI?.cargarHeader) {
        await window.UI.cargarHeader();
      } else {
        console.error('No se pudo inicializar el header compartido: js/ui.js no está disponible.');
      }

      // Configurar el formulario de registro
      const oficioSelect = document.getElementById('oficio');
      const otroContainer = document.getElementById('otroOficioContainer');

      if (oficioSelect) {
        oficioSelect.addEventListener('change', () => {
          otroContainer.style.display = oficioSelect.value === 'Otro' ? 'block' : 'none';
        });
      }

      const btn = document.getElementById('btnRegistrar');
      const mensajeDiv = document.getElementById('mensajeGlobal');

      function mostrarMensaje(texto, esError = true) {
        mensajeDiv.innerHTML = `<div class="${esError ? 'mensaje-error' : 'mensaje-exito'}">${texto}</div>`;
        setTimeout(() => {
          if (mensajeDiv.innerHTML.includes(texto)) mensajeDiv.innerHTML = '';
        }, 5000);
      }

      if (btn) {
        btn.addEventListener('click', async () => {
          const nombre = document.getElementById('nombre').value.trim();
          const email = document.getElementById('email').value.trim();
          const password = document.getElementById('password').value.trim();
          const telefono = document.getElementById('telefono').value.trim();
          const direccion = document.getElementById('direccion').value.trim();
          let oficio = oficioSelect.value;

          if (oficio === 'Otro') {
            oficio = document.getElementById('otroOficio').value.trim();
            if (!oficio) {
              mostrarMensaje('Por favor escribe tu oficio en el campo "Otro"');
              return;
            }
          }

          if (!nombre || !email || !password || !telefono || !direccion || !oficio) {
            mostrarMensaje('Por favor completa todos los campos marcados con *');
            return;
          }

          if (password.length < 6) {
            mostrarMensaje('La contraseña debe tener al menos 6 caracteres');
            return;
          }

          if (!document.getElementById('aceptoPrivacidad').checked) {
            mostrarMensaje('Debes confirmar que tuviste a disposición el Aviso de Privacidad Integral');
            return;
          }

          if (!document.getElementById('acepto').checked) {
            mostrarMensaje('Debes aceptar el Compromiso de Confianza Vecinal');
            return;
          }

          btn.disabled = true;
          btn.innerHTML = '<span class="spinner"></span> Registrando...';

          try {
            const resultado = await API.registro({
              nombre: nombre,
              email: email,
              password: password,
              telefono: telefono,
              rol: 'usuario',
              categorias: oficio,
              direccion: direccion,
              privacyNoticeAck: true,
              privacyNoticeVersion: '1.0',
              privacyNoticeBlobSha: '636f6c4f018e3bb5124b25451d67db519f6ec892',
              commitmentAccept: true,
              commitmentVersion: '1.0',
              commitmentBlobSha: '1d71fd10021c565b2002d72909fbb2cd16937c36'
            });

            // ✅ Nuevo código
            console.log('Registro exitoso:', resultado);

            // Guardar sesión automáticamente
            if (resultado && resultado.data && resultado.data.api_key) {
              localStorage.setItem('api_key', resultado.data.api_key);
              localStorage.setItem('usuario', JSON.stringify(resultado.data.usuario));
              mostrarMensaje(`✅ ¡Bienvenido/a ${nombre}! Registro exitoso.`, false);
              setTimeout(() => {
                window.location.href = '/admin.html';
              }, 1500);
            } else if (resultado && resultado.api_key) {
              // Si la respuesta viene sin .data
              localStorage.setItem('api_key', resultado.api_key);
              if (resultado.usuario) {
                localStorage.setItem('usuario', JSON.stringify(resultado.usuario));
              }
              mostrarMensaje(`✅ ¡Bienvenido/a ${nombre}! Registro exitoso.`, false);
              setTimeout(() => {
                window.location.href = '/admin.html';
              }, 1500);
            } else {
              // Si no viene api_key, solo mostrar mensaje y redirigir al login
              mostrarMensaje(`✅ ¡Bienvenido/a ${nombre}! Tu registro fue exitoso. Ahora inicia sesión.`, false);
              setTimeout(() => {
                window.location.href = '/login.html';
              }, 2000);
            }

          } catch (error) {
            console.error('Error en registro:', error);
            mostrarMensaje('Error: ' + error.message);
          } finally {
            btn.disabled = false;
            btn.innerHTML = 'Registrarme';
          }
        });
      }
    }); // ← Cierre del addEventListener
  </script>

  <script>
    // Forzar la funcionalidad de "Otro" oficio
    (function () {
      const oficioSelect = document.getElementById('oficio');
      const otroContainer = document.getElementById('otroOficioContainer');

      if (oficioSelect && otroContainer) {
        // Función para mostrar/ocultar el campo "Otro"
        function toggleOtroOficio() {
          if (oficioSelect.value === 'Otro') {
            otroContainer.style.display = 'block';
            document.getElementById('otroOficio').required = true;
          } else {
            otroContainer.style.display = 'none';
            document.getElementById('otroOficio').required = false;
            document.getElementById('otroOficio').value = '';
          }
        }

        // Ejecutar al cargar
        toggleOtroOficio();

        // Ejecutar cuando cambie la selección
        oficioSelect.addEventListener('change', toggleOtroOficio);
      }
    })();
  </script>

  
  
  <script src="/common/consentimiento.js?v=20261109-privacy1" defer></script>
  <script src="/js/metricas-trafico.js?v=20261106-4" defer></script>
  <script src="/js/transiciones.js?v=20261109-2"></script>
</body>

</html>
