name: Remove legacy admin dashboard script

on:
  push:
    paths:
      - '.github/workflows/remove-legacy-admin-dashboard.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove legacy dashboard JavaScript from admin footer
        shell: python
        run: |
          from pathlib import Path
          p = Path('common/footer-admin.html')
          text = p.read_text(encoding='utf-8')
          start = text.find('<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>')
          if start < 0:
              raise SystemExit('Legacy Chart.js script marker not found')
          end = text.rfind('</script>')
          if end < start:
              raise SystemExit('Legacy dashboard closing script not found')
          end += len('</script>')
          new_text = text[:start].rstrip() + '\n'
          p.write_text(new_text, encoding='utf-8')

      - name: Bump footer asset version in admin page
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('/common/footer-admin.html?v=20260903-1', '/common/footer-admin.html?v=20260903-2')
          p.write_text(text, encoding='utf-8')

      - name: Commit fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add common/footer-admin.html admin.html .github/workflows/remove-legacy-admin-dashboard.yml
          git commit -m 'remove legacy admin dashboard script' || exit 0
          git push
