name: Aplicar privacidad de nombres

on:
  push:
    paths:
      - '.github/workflows/aplicar-privacidad-comentarios.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar cambios
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('js/app.js')
          text = app.read_text(encoding='utf-8')
          old = '<div class="comment-author">${escapeHTML(com.autor)}</div>'
          new = '<div class="comment-author${sesionActiva ? \' autor-visible\' : \'\'}">${escapeHTML(com.autor)}</div>'
          if old not in text:
              raise SystemExit('No se encontró el render de comment-author esperado')
          text = text.replace(old, new, 1)
          app.write_text(text, encoding='utf-8')

          css = Path('css/estilo-index.css')
          css_text = css.read_text(encoding='utf-8')

          author_old = '.aviso-autor{margin:7px 0 10px;color:#56606a;font-size:.82rem;font-weight:650;display:flex;align-items:center;gap:5px}'
          author_new = '''.aviso-autor{margin:7px 0 10px;color:#56606a;font-size:.82rem;font-weight:650;display:flex;align-items:center;gap:5px;filter:blur(5px);user-select:none}\n.aviso-autor.autor-visible{filter:none;user-select:text}'''
          if author_old in css_text:
              css_text = css_text.replace(author_old, author_new, 1)
          elif '.aviso-autor.autor-visible' not in css_text:
              css_text += '\n\n.aviso-autor{filter:blur(5px);user-select:none}\n.aviso-autor.autor-visible{filter:none;user-select:text}\n'

          marker = '/* Privacidad visual del nombre de los comentaristas */'
          if marker not in css_text:
              css_text += '''\n\n/* Privacidad visual del nombre de los comentaristas */\n.comment-author{filter:blur(5px);user-select:none;pointer-events:none}\n.comment-author.autor-visible{filter:none;user-select:text;pointer-events:auto}\n'''

          css.write_text(css_text, encoding='utf-8')
          PY

      - name: Commit cambios y eliminar workflow temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js css/estilo-index.css .github/workflows/aplicar-privacidad-comentarios.yml
          git commit -m "Privacidad de nombres en avisos y comentarios"
          git rm .github/workflows/aplicar-privacidad-comentarios.yml
          git commit -m "Eliminar workflow temporal de privacidad"
          git push