name: Fix admin session race
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin metrics startup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/admin.js')
          s = p.read_text(encoding='utf-8')
          old = "    let cargando=false;\n    const DIAS=30;"
          new = "    let cargando=false;\n    let sesionAdminLista=false;\n    const DIAS=30;\n\n    async function asegurarSesionAdmin(){\n        if(sesionAdminLista)return true;\n        if(!window.Auth||typeof window.Auth.requireAuth!=='function')throw new Error('Sistema de autenticación no disponible.');\n        const usuario=await window.Auth.requireAuth();\n        if(!usuario?.id)throw new Error('Sesión de administrador no disponible.');\n        sesionAdminLista=true;\n        console.log('🔐 Sesión admin confirmada antes de cargar métricas:',usuario.id);\n        return true;\n    }"
          if old not in s:
              raise SystemExit('No se encontró el punto de inserción esperado en admin.js')
          s = s.replace(old, new, 1)
          old2 = "        if(cargando)return;\n        cargando=true;"
          new2 = "        if(cargando)return;\n        try{await asegurarSesionAdmin();}catch(error){console.error('❌ Admin: sesión no lista para métricas:',error);const badge=document.getElementById('onlineCount');if(badge)badge.textContent='No disponible';return;}\n        cargando=true;"
          if old2 not in s:
              raise SystemExit('No se encontró el bloqueo de carga esperado en admin.js')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-admin-session-race.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/admin.js .github/workflows/fix-admin-session-race.yml
          git diff --cached --quiet && exit 0
          git commit -m 'wait for admin session before metrics'
          git push