name: Force fresh admin assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'Force fresh admin assets' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add cache-busting version to admin assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '<script src="/js/auth.js"></script>': '<script src="/js/auth.js?v=20260903-1"></script>',
              '<script src="/js/api.js"></script>': '<script src="/js/api.js?v=20260903-1"></script>',
              '<script src="/js/ui.js"></script>': '<script src="/js/ui.js?v=20260903-1"></script>',
              '<script src="/js/admin.js"></script>': '<script src="/js/admin.js?v=20260903-1"></script>',
              "fetch('/common/footer-admin.html')": "fetch('/common/footer-admin.html?v=20260903-1')",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'No se encontró el patrón esperado: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify and commit
        run: |
          grep -nE 'script src="/js/(auth|api|ui|admin)\.js|footer-admin\.html' admin.html
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git rm .github/workflows/force-fresh-admin-assets.yml
          git commit -m "Force fresh admin assets"
          git push
