name: Fix registration flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'temp patch registration' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch auth and api
        run: |
          python3 - <<'PY'
          from pathlib import Path

          auth = Path('js/auth.js')
          text = auth.read_text()
          marker = "  async requireAuth() {"
          if "  async registro(datos) {" not in text:
              method = r'''  async registro(datos) {
    const client = await obtenerSupabaseClient();
    const email = String(datos?.email || '').trim().toLowerCase();
    const password = String(datos?.password || '');

    if (!email || !password) throw new Error('Correo y contraseña son obligatorios');
    if (password.length < 6) throw new Error('La contraseña debe tener al menos 6 caracteres');

    const metadata = {
      nombre: String(datos?.nombre || '').trim(),
      telefono: String(datos?.telefono || '').trim(),
      direccion: String(datos?.direccion || '').trim(),
      categorias: String(datos?.categorias || '').trim(),
      rol: 'usuario'
    };

    console.log('🟡 Registrando usuario en Supabase:', email);

    const { data, error } = await client.auth.signUp({
      email,
      password,
      options: { data: metadata }
    });

    if (error) {
      console.error('❌ Error Supabase Auth signUp:', error);
      throw error;
    }

    const session = data?.session || null;
    const user = data?.user || null;
    let usuario = null;

    if (user && session) {
      usuario = await construirUsuario(client, user);
      guardarCompatibilidad(usuario, session);
    }

    console.log('🟢 Registro Supabase completado:', {
      user_id: user?.id,
      tiene_session: !!session,
      requiere_confirmacion: !!user && !session
    });

    return {
      success: true,
      data: {
        user,
        session,
        usuario,
        requiere_confirmacion: !!user && !session,
        api_key: session?.access_token || null
      },
      user,
      usuario,
      api_key: session?.access_token || null
    };
  },
'''
              if marker not in text:
                  raise SystemExit('No se encontró el punto de inserción en auth.js')
              text = text.replace(marker, method + marker, 1)
              auth.write_text(text)

          api = Path('js/api.js')
          text = api.read_text()
          text = text.replace(
              "const API_API_SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_x01F_xzyh5b-sZdwhKh6FQ_OzQVxMpN';",
              "const API_SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_x01F_xzyh5b-sZdwhKh6FQ_OzQVxMpN';"
          )
          marker = "  static getUsuarioActual() { return getUsuarioLocal(); }"
          if "  static async registro(datos)" not in text:
              method = "  static async registro(datos) {\n    if (typeof Auth !== 'undefined' && typeof Auth.registro === 'function') {\n      return await Auth.registro(datos);\n    }\n    throw new Error('Servicio de registro no disponible');\n  }\n"
              if marker not in text:
                  raise SystemExit('No se encontró el punto de inserción en api.js')
              text = text.replace(marker, method + marker, 1)
          api.write_text(text)
          PY
      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/auth.js js/api.js .github/workflows/fix-registration.yml
          git rm .github/workflows/fix-registration.yml
          git commit -m "Fix Supabase registration flow"
          git push
