name: Restore public avisos listing
on:
  push:
    paths:
      - '.github/workflows/restore-public-avisos.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore non-filtering author joins
        shell: python
        run: |
          from pathlib import Path

          p = Path('js/api.js')
          s = p.read_text(encoding='utf-8')
          old = 'usuarios!avisos_created_by_fkey!inner (nombre)'
          new = 'usuarios!avisos_created_by_fkey (nombre)'
          if old not in s:
              raise SystemExit('No se encontró el join INNER de avisos')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          Path('.github/workflows/restore-public-avisos.yml').unlink()

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/api.js .github/workflows/restore-public-avisos.yml
          git commit -m "Restaurar listado público de avisos"
          git push
