name: Fix author privacy syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix generated JavaScript syntax
        shell: python
        run: |
          from pathlib import Path
          p = Path('js/app.js')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace("\\\\'Usuario\\\\'", "'Usuario'")
          if s2 == s:
              raise SystemExit('No se encontraron escapes incorrectos en js/app.js')
          p.write_text(s2, encoding='utf-8')
      - name: Commit and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git rm .github/workflows/fix-author-syntax.yml
          git commit -m "Corregir sintaxis del autor oculto"
          git push
