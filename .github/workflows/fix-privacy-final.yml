name: Fix privacy final
on:
  push:
    paths:
      - '.github/workflows/fix-privacy-final.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply CSS privacy rules
        run: |
          cat >> css/index2.css <<'EOF'

/* Privacidad visual de autores y comentaristas */
.aviso-autor { filter: blur(5px); user-select: none; }
.aviso-autor.autor-visible { filter: none; user-select: text; }
.comment-author { filter: blur(5px); user-select: none; pointer-events: none; }
.comment-author.autor-visible { filter: none; user-select: text; pointer-events: auto; }
EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/index2.css
          git commit -m "Aplicar blur real a autores y comentaristas"
          git push
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/fix-privacy-final.yml
          git add .github/workflows/fix-privacy-final.yml
          git commit -m "Eliminar workflow temporal de privacidad"
          git push