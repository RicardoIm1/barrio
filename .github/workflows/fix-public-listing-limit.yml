name: Fix public listing limit

on:
  push:
    paths:
      - '.github/workflows/fix-public-listing-limit.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove the 20-notice cap
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/auth.js')
          text = path.read_text(encoding='utf-8')

          old = "const limiteSolicitado = Number(paginacion?.limite) || 20;\n    const limiteSeguro = Math.min(20, Math.max(1, limiteSolicitado));"
          new = "const limiteSolicitado = Number(paginacion?.limite) || 1000;\n    const limiteSeguro = Math.min(1000, Math.max(1, limiteSolicitado));"

          if old not in text:
              print('No se encontró el bloque objetivo. No se modifica auth.js.')
              raise SystemExit(0)

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('Límite público actualizado: máximo 1000 avisos.')
          PY

      - name: Commit auth.js and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/auth.js
          git rm .github/workflows/fix-public-listing-limit.yml
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
            exit 0
          fi
          git commit -m "allow public index to load all notices"
          git push
