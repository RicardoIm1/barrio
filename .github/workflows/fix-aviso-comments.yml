name: Fix aviso comments
on:
  push:
    paths:
      - '.github/workflows/fix-aviso-comments.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore working comments query
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('aviso.html')
          s = p.read_text(encoding='utf-8')
          old = "select('id,aviso_id,usuario_id,contenido,created_at,usuarios!inner(nombre)')"
          new = "select('id,aviso_id,usuario_id,nombre_autor,contenido,created_at')"
          if old not in s:
              raise SystemExit('Target query not found')
          s = s.replace(old, new)
          s = s.replace("esc(x.usuarios?.nombre||x.nombre_autor||'Anónimo')", "esc(x.nombre_autor||'Anónimo')")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aviso.html
          git commit -m "Restaurar comentarios de aviso" || exit 0
          git push
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/fix-aviso-comments.yml
          git add -A
          git commit -m "Eliminar workflow temporal de comentarios" || exit 0
          git push
