name: Fix index author names
on:
  push:
    branches: [main]

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix index author names'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_css = '.aviso-autor-privado{display:inline-block;filter:blur(5px);user-select:none;pointer-events:none;opacity:.78;transform:translateZ(0)}'
          new_css = '.aviso-autor{display:inline-block;filter:blur(5px);user-select:none;pointer-events:none;opacity:.78;transform:translateZ(0)}\n.aviso-autor.autor-visible{filter:none;user-select:text;pointer-events:auto;opacity:1}'
          s = s.replace(old_css, new_css, 1)
          old_render = '${escapeHtml(aviso.nombre_autor || "Vecino")}'
          new_render = '${escapeHtml(aviso.usuario_nombre || aviso.nombre_autor || "")}'
          s = s.replace(old_render, new_render, 1)
          start = s.find('      // Función para enriquecer avisos con nombres de usuario')
          end = s.find('      async function cargarAvisos()', start)
          if start != -1 and end != -1:
            helper = '''      // Obtener el nombre real mediante created_by -> usuarios.id -> usuarios.nombre.\n      // Se consulta desde index.html para no modificar la API ni ocultar avisos.\n      async function enriquecerAvisosConUsuarios(avisos) {\n        if (!Array.isArray(avisos) || avisos.length === 0) return avisos;\n        const ids = [...new Set(avisos.map((aviso) => aviso?.created_by || aviso?.usuario_id).filter(Boolean).map(String))];\n        if (ids.length === 0) return avisos;\n        try {\n          const client = await getSupabaseClient();\n          const { data: usuarios, error } = await client.from("usuarios").select("id,nombre").in("id", ids);\n          if (error) throw error;\n          const nombres = new Map((usuarios || []).filter((usuario) => usuario?.id && usuario?.nombre).map((usuario) => [String(usuario.id), String(usuario.nombre).trim()]));\n          avisos.forEach((aviso) => {\n            const autorId = aviso?.created_by || aviso?.usuario_id;\n            const nombre = autorId ? nombres.get(String(autorId)) : "";\n            if (nombre) { aviso.usuario_nombre = nombre; aviso.nombre_autor = nombre; }\n          });\n        } catch (error) {\n          console.warn("No se pudieron obtener los nombres reales de los autores:", error);\n        }\n        return avisos;\n      }\n\n'''
            s = s[:start] + helper + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'aviso-autor.autor-visible' index.html
          ! grep -q 'nombre_autor || "Vecino"' index.html
          grep -q 'from("usuarios").select("id,nombre")' index.html
      - name: Commit index and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/index-author-fix.yml
          git add index.html .github/workflows/index-author-fix.yml
          git commit -m "Fix index author names"
          git push origin main
