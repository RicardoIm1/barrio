name: Fix author joins
on:
  push:
    paths:
      - '.github/workflows/fix-joins.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch joins
        shell: python
        run: |
          from pathlib import Path

          p = Path('js/api.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('usuarios!avisos_created_by_fkey (nombre)', 'usuarios!avisos_created_by_fkey!inner (nombre)')
          s = s.replace("nombre_autor: aviso.usuarios?.nombre || aviso.nombre_autor || 'Usuario'", "nombre_autor: aviso.usuarios?.nombre || aviso.autor?.nombre || aviso.nombre_autor || aviso.nombre_usuario || 'Usuario'")
          p.write_text(s, encoding='utf-8')

          p = Path('aviso.html')
          s = p.read_text(encoding='utf-8')
          old = "select('id,aviso_id,usuario_id,nombre_autor,contenido,created_at')"
          new = "select('id,aviso_id,usuario_id,contenido,created_at,usuarios!inner(nombre)')"
          if old not in s:
              raise SystemExit('No se encontró la consulta directa de comentarios en aviso.html')
          s = s.replace(old, new, 1)
          s = s.replace("esc(x.nombre_autor||'Anónimo')", "esc(x.usuarios?.nombre||x.nombre_autor||'Anónimo')", 1)
          p.write_text(s, encoding='utf-8')

          Path('.github/workflows/fix-joins.yml').unlink()

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/api.js aviso.html .github/workflows/fix-joins.yml
          git commit -m "Usar inner join para nombres de autores y comentaristas"
          git push
