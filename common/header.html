<script>
    (function () {
        function obtenerUsuarioLocal() {
            const usuarioStr = localStorage.getItem('usuario');
            const apiKey = localStorage.getItem('api_key');
            if (usuarioStr && apiKey) {
                try { return JSON.parse(usuarioStr); } catch (e) { return null; }
            }
            return null;
        }

        async function cerrarSesion() {
            try {
                if (typeof obtenerSupabaseClient === 'function') {
                    const client = await obtenerSupabaseClient();
                    await client.auth.signOut();
                } else if (window.__elBarrioSupabaseClient) {
                    await window.__elBarrioSupabaseClient.auth.signOut();
                }
            } catch (e) {
                console.warn('No se pudo cerrar la sesión Supabase:', e);
            } finally {
                localStorage.removeItem('usuario');
                localStorage.removeItem('api_key');
                window.location.href = '/index.html';
            }
        }

        function actualizarBotones() {
            const usuario = obtenerUsuarioLocal();
            const loginLink = document.getElementById('login-link');
            const userArea = document.getElementById('user-area');
            const userNameSpan = document.getElementById('user-name');
            const perfilLink = document.getElementById('perfil-link');
            const cerrarBtn = document.getElementById('cerrar-sesion');

            if (!loginLink) { setTimeout(actualizarBotones, 100); return; }

            if (usuario) {
                loginLink.style.display = 'none';
                userArea.style.display = 'flex';

                const esAdmin = usuario.rol === 'admin';
                const nombreMostrar = usuario.nombre || usuario.email || 'Usuario';
                if (userNameSpan) {
                    userNameSpan.textContent = `👋 ${nombreMostrar}`;
                    userNameSpan.classList.add('admin-link');
                    userNameSpan.title = 'Abrir panel de administración';
                    userNameSpan.setAttribute('role', 'link');
                    userNameSpan.setAttribute('tabindex', '0');
                    userNameSpan.onclick = function (e) { e.preventDefault(); e.stopPropagation(); window.location.href = '/admin.html'; };
                    userNameSpan.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); window.location.href = '/admin.html'; } };
                }

                if (perfilLink) {
                    perfilLink.onclick = function (e) {
                        e.preventDefault();
                        window.location.href = '/perfil.html';
                    };
                }

                if (cerrarBtn) {
                    const nuevoCerrar = cerrarBtn.cloneNode(true);
                    nuevoCerrar.dataset.logoutInit = '1';
                    cerrarBtn.parentNode.replaceChild(nuevoCerrar, cerrarBtn);
                    nuevoCerrar.addEventListener('click', function (e) {
                        e.preventDefault();
                        e.stopPropagation();
                        cerrarSesion();
                    });
                }
            } else {
                loginLink.style.display = 'inline-flex';
                userArea.style.display = 'none';
                if (userNameSpan) userNameSpan.onclick = null;
            }
        }

        actualizarBotones();
        const menuToggle = document.getElementById('header-menu-toggle');
        const menuAcciones = document.getElementById('header-acciones');
        if (menuToggle && menuAcciones && !menuToggle.dataset.menuInit) {
            menuToggle.dataset.menuInit = '1';
            const cerrarMenu = () => { menuAcciones.classList.remove('menu-open'); menuToggle.setAttribute('aria-expanded', 'false'); menuToggle.setAttribute('aria-label', 'Abrir menú'); };
            menuToggle.addEventListener('click', () => {
                if (menuToggle.getAttribute('aria-expanded') === 'true') cerrarMenu();
                else { menuAcciones.classList.add('menu-open'); menuToggle.setAttribute('aria-expanded', 'true'); menuToggle.setAttribute('aria-label', 'Cerrar menú'); }
            });
            document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarMenu(); });
            document.addEventListener('pointerdown', e => { if (!menuAcciones.contains(e.target) && !menuToggle.contains(e.target)) cerrarMenu(); });
            window.addEventListener('resize', () => { if (window.innerWidth > 768) cerrarMenu(); });
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', actualizarBotones);
        window.addEventListener('storage', function (e) {
            if (e.key === 'usuario' || e.key === 'api_key') actualizarBotones();
        });
        window.actualizarHeaderSesion = actualizarBotones;
        window._headerActualizarBotones = actualizarBotones;
    })();
</script>
<script>
    setTimeout(() => {
        const buscadorHeader = document.getElementById('buscador-input-header');
        const contenedorBuscador = buscadorHeader?.closest('.header-buscador');
        const aceptar = document.getElementById('buscador-aceptar');
        const cancelar = document.getElementById('buscador-cancelar');

        if (!buscadorHeader || !contenedorBuscador) return;

        const esMovil = () => window.matchMedia('(max-width: 768px)').matches;
        const contraer = () => contenedorBuscador.classList.remove('activo');
        const aceptarBusqueda = () => {
            contraer();
            buscadorHeader.blur();
        };
        const cancelarBusqueda = () => {
            buscadorHeader.value = '';
            buscadorHeader.dispatchEvent(new Event('input', { bubbles: true }));
            contraer();
            buscadorHeader.blur();
        };

        buscadorHeader.addEventListener('focus', () => {
            if (esMovil()) contenedorBuscador.classList.add('activo');
        });
        buscadorHeader.addEventListener('input', (e) => {
            currentSearchTerm = e.target.value;
            applyFiltersAndSearch();
        });
        buscadorHeader.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                aceptarBusqueda();
            } else if (e.key === 'Escape') {
                e.preventDefault();
                cancelarBusqueda();
            }
        });
        aceptar?.addEventListener('click', aceptarBusqueda);
        cancelar?.addEventListener('click', cancelarBusqueda);

        document.addEventListener('pointerdown', (e) => {
            if (esMovil() && !contenedorBuscador.contains(e.target)) contraer();
        });
    }, 500);
</script>
<script>
    // Evita la carrera de inicialización entre auth.js y el dashboard de administración.
    // No concede permisos: únicamente espera a que Supabase termine de restaurar la sesión.
    (function instalarEsperaSesionAdmin() {
        let instalado = false;
        let intentos = 0;
        const maxIntentos = 20;

        function instalar() {
            if (instalado || !window.Auth || typeof window.Auth.requireAuth !== 'function') return;
            const original = window.Auth.requireAuth;
            if (original.__elBarrioRetrySesion) {
                instalado = true;
                return;
            }

            async function requireAuthConEspera() {
                let ultimoUsuario = null;
                for (let intento = 0; intento < 8; intento++) {
                    try {
                        ultimoUsuario = await original();
                        if (ultimoUsuario?.id) return ultimoUsuario;
                    } catch (error) {
                        if (intento === 7) throw error;
                    }
                    await new Promise(resolve => setTimeout(resolve, 350));
                }
                return ultimoUsuario;
            }

            requireAuthConEspera.__elBarrioRetrySesion = true;
            window.Auth.requireAuth = requireAuthConEspera;
            instalado = true;
            console.log('🟢 Espera de sesión admin instalada');
        }

        instalar();
        const timer = setInterval(() => {
            instalar();
            intentos++;
            if (instalado || intentos >= maxIntentos) clearInterval(timer);
        }, 100);
    })();
</script>
