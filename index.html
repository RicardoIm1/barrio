    <script>
      // ========== VARIABLES GLOBALES ==========
      let currentAvisoIdForComments = null;
      let isLoading = false;
      let hasMore = true;
      let currentSearchTerm = "";
      let allAvisos = [];
      let filteredAvisos = [];
      let renderedCount = 0;
      let searchRenderVersion = 0;
      let isLoadingAvisos = false;
      let avisosCargados = false;
      let sesionActivaParaAutores = false;

      // UNA SOLA llamada para obtener TODOS los votos del usuario
      let userVotes = {}; // { avisoId: 'like' o 'dislike' }
      let userVotesLoaded = false;

      function showToast(message, duration = 2000) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), duration);
      }

      async function registrarVista(id) {
        try {
          const resultado = await API.peticion("REGISTRAR_VISTA", { id: id });
          const vistas = Number(resultado?.vistas ?? resultado?.data?.vistas);
          if (Number.isFinite(vistas)) {
            const aviso = allAvisos.find((a) => String(a.id) === String(id));
            if (aviso) aviso.vistas = vistas;
            const card = document.querySelector(`.aviso-card[data-id="${id}"]`);
            const span = card?.querySelector(
              ".stat-item:first-child .stat-value",
            );
            if (span) span.textContent = vistas;
          }
        } catch (e) {
          console.warn("Error registrando vista:", e);
        }
      }

      function aplicarVistaPendiente() {
        try {
          const raw = localStorage.getItem("elbarrio_vista_actualizada");
          if (!raw) return;
          const pendiente = JSON.parse(raw);
          if (!pendiente?.id || !Number.isFinite(Number(pendiente.vistas)))
            return;

          const aviso = allAvisos.find(
            (a) => String(a.id) === String(pendiente.id),
          );
          if (aviso) aviso.vistas = Number(pendiente.vistas);

          const card = document.querySelector(
            `.aviso-card[data-id="${pendiente.id}"]`,
          );
          const span = card?.querySelector(
            ".stat-item:first-child .stat-value",
          );
          if (span) span.textContent = Number(pendiente.vistas);

          localStorage.removeItem("elbarrio_vista_actualizada");
        } catch (e) {
          console.warn("No se pudo sincronizar la vista pendiente:", e);
          localStorage.removeItem("elbarrio_vista_actualizada");
        }
      }

      window.addEventListener("pageshow", aplicarVistaPendiente);

      async function registrarClickWhatsApp(id) {
        try {
          // Usar el método que ejecuta el RPC real en Supabase.
          const resultado = await API.registrarClickWhatsApp(id);
          if (!resultado?.success) {
            console.warn(
              "Supabase no confirmó el registro del click de WhatsApp:",
              resultado?.error,
            );
            return;
          }
          const card = document.querySelector(`.aviso-card[data-id="${id}"]`);
          const whatsappStat = card?.querySelector(
            ".whatsapp-stat .stat-value",
          );
          if (whatsappStat) {
            const actual = Number.parseInt(whatsappStat.textContent, 10) || 0;
            whatsappStat.textContent = actual + 1;
          }
        } catch (e) {
          console.warn("Error registrando click WhatsApp:", e);
        }
      }

      // ========== VOTACIÓN OPTIMIZADA (SIN llamadas por separado) ==========

      async function cargarTodosLosVotos() {
        const apiKey = localStorage.getItem("api_key");
        if (!apiKey || userVotesLoaded) {
          userVotesLoaded = true;
          return;
        }

        try {
          // UNA SOLA llamada para obtener todos los votos del usuario
          const resultado = await API.peticion("OBTENER_MIS_VOTOS", {}, apiKey);
          if (resultado && resultado.success && resultado.data) {
            for (const voto of resultado.data) {
              userVotes[voto.aviso_id] = voto.tipo; // 'like' o 'dislike'
            }
          }
        } catch (e) {
          console.warn("Error cargando votos (usar endpoint alternativo):", e);
          // Fallback: endpoint alternativo si existe
          try {
            const resultado2 = await API.peticion(
              "VERIFICAR_VOTOS_MULTIPLES",
              { ids: allAvisos.map((a) => a.id) },
              apiKey,
            );
            if (resultado2 && resultado2.success && resultado2.data) {
              for (const [id, tipo] of Object.entries(resultado2.data)) {
                if (tipo) userVotes[id] = tipo;
              }
            }
          } catch (e2) {
            console.warn("Error en fallback:", e2);
          }
        }
        userVotesLoaded = true;
      }

      async function darLike(avisoId) {
        const apiKey = localStorage.getItem("api_key");
        if (!apiKey) {
          showToast("🔐 Inicia sesión para dar like", 2000);
          return false;
        }

        try {
          const resultado = await API.peticion(
            "VOTAR_AVISO",
            {
              aviso_id: avisoId,
              tipo: "positivo",
            },
            apiKey,
          );

          if (resultado && resultado.success) {
            return resultado;
          }
          return false;
        } catch (e) {
          console.error("Error:", e);
          return false;
        }
      }

      async function darDislike(avisoId) {
        const apiKey = localStorage.getItem("api_key");
        if (!apiKey) {
          showToast("🔐 Inicia sesión para dar dislike", 2000);
          return false;
        }

        if (userVotes[avisoId] === "dislike") {
          showToast("👎 Ya te disgusta este aviso", 1500);
          return false;
        }

        try {
          const resultado = await API.peticion(
            "DAR_DISLIKE",
            { id: avisoId },
            apiKey,
          );
          if (resultado && resultado.success) {
            userVotes[avisoId] = "dislike";
            actualizarContadoresCard(
              avisoId,
              resultado.likes,
              resultado.dislikes,
            );
            showToast("👎 Dislike registrado", 1500);

            if (resultado.dislikes >= 3) {
              const card = document.querySelector(
                `.aviso-card[data-id="${avisoId}"]`,
              );
              if (card) card.style.display = "none";
              showToast(
                "⚠️ Este aviso ha sido eliminado por la comunidad",
                3000,
              );
            }
            return true;
          }
        } catch (e) {
          console.error("Error dando dislike:", e);
          showToast("❌ Error de conexión", 1500);
        }
        return false;
      }

      function actualizarContadoresCard(avisoId, nuevosLikes, nuevosDislikes) {
        const card = document.querySelector(
          `.aviso-card[data-id="${avisoId}"]`,
        );
        if (!card) return;

        const likeSpan = card.querySelector(".like-btn .stat-value");
        const dislikeSpan = card.querySelector(".dislike-btn .stat-value");
        const likeBtn = card.querySelector(".like-btn");
        const dislikeBtn = card.querySelector(".dislike-btn");

        if (likeSpan && nuevosLikes !== undefined)
          likeSpan.textContent = nuevosLikes;
        if (dislikeSpan && nuevosDislikes !== undefined)
          dislikeSpan.textContent = nuevosDislikes;

        if (likeBtn) {
          if (userVotes[avisoId] === "like") likeBtn.classList.add("liked");
          else likeBtn.classList.remove("liked");
        }
        if (dislikeBtn) {
          if (userVotes[avisoId] === "dislike")
            dislikeBtn.classList.add("disliked");
          else dislikeBtn.classList.remove("disliked");
        }
      }
      // ========== FUNCIONES DE INTERACCIÓN ==========

      window.verAviso = function (id) {
        console.log("Abriendo aviso con ID:", id);
        // ✅ No registrar vista aquí - solo al cargar aviso.html
        window.location.href = `/aviso.html?id=${id}`;
      };

      window.abrirWhatsApp = function (numero, texto, id, event) {
        if (event) {
          event.preventDefault();
          event.stopPropagation();
        }

        // 🔐 VALIDACIÓN DE SESIÓN - OBLIGATORIA
        const apiKey = localStorage.getItem("api_key");
        if (!apiKey) {
          // Usa tu función showToast si existe, o alert
          if (typeof showToast === "function") {
            showToast("🔐 Inicia sesión para contactar por WhatsApp", 2000);
          } else {
            alert("🔐 Debes iniciar sesión para contactar por WhatsApp");
          }
          return;
        }

        let numeroLimpio = String(numero).replace(/[^0-9]/g, "");

        const url = `https://wa.me/52${numeroLimpio}?text=${encodeURIComponent(texto)}`;

        window.open(url, "_blank");

        if (id) {
          registrarClickWhatsApp(id).catch((e) =>
            console.warn("Error registrando click:", e),
          );
        }
      };

      window.darLikeWrapper = async function (id, event) {
        if (event) event.stopPropagation();
        console.log("🔵 Click en like para aviso:", id);

        const apiKey = localStorage.getItem("api_key");
        if (!apiKey) {
          showToast("🔐 Inicia sesión para dar like", 2000);
          return;
        }

        try {
          const resultado = await API.peticion(
            "VOTAR_AVISO",
            {
              aviso_id: id,
              tipo: "positivo",
            },
            apiKey,
          );

          console.log("📥 Respuesta:", resultado);

          if (resultado && resultado.success) {
            // Actualizar el contador en la tarjeta
            const card = document.querySelector(`.aviso-card[data-id="${id}"]`);
            if (card) {
              const likesSpan = card.querySelector(".like-btn .stat-value");
              const nuevosLikes = resultado.data?.likes || resultado.likes;
              if (likesSpan) likesSpan.textContent = nuevosLikes;
              showToast("👍 Like registrado", 1500);
            }
          } else {
            showToast("❌ Error: " + (resultado?.error || "No se pudo"), 1500);
          }
        } catch (error) {
          console.error("Error:", error);
          showToast("❌ Error de conexión", 1500);
        }
      };

      window.darDislikeWrapper = async function (id, event) {
        if (event) event.stopPropagation();
        console.log("🔴 Click en dislike para aviso:", id);

        const apiKey = localStorage.getItem("api_key");
        if (!apiKey) {
          showToast("🔐 Inicia sesión para dar dislike", 2000);
          return;
        }

        try {
          const resultado = await API.peticion(
            "VOTAR_AVISO",
            {
              aviso_id: id,
              tipo: "negativo",
            },
            apiKey,
          );

          console.log("📥 Respuesta:", resultado);

          if (resultado && resultado.success) {
            const card = document.querySelector(`.aviso-card[data-id="${id}"]`);
            if (card) {
              const dislikesSpan = card.querySelector(
                ".dislike-btn .stat-value",
              );
              const nuevosDislikes =
                resultado.data?.dislikes || resultado.dislikes;
              if (dislikesSpan) dislikesSpan.textContent = nuevosDislikes;
              showToast("👎 Dislike registrado", 1500);
            }
          } else {
            showToast("❌ Error: " + (resultado?.error || "No se pudo"), 1500);
          }
        } catch (error) {
          console.error("Error:", error);
          showToast("❌ Error de conexión", 1500);
        }
      };

      window.abrirComentarios = function (id, event) {
        if (event) event.stopPropagation();

        // ✅ VERIFICAR QUE EL USUARIO ESTÉ LOGUEADO PARA VER COMENTARIOS
        const apiKey = localStorage.getItem("api_key");
        if (!apiKey) {
          showToast("🔐 Inicia sesión para ver y comentar", 1500);
          return;
        }

        currentAvisoIdForComments = id;
        document.getElementById("comments-panel").classList.add("open");
        cargarComentarios(id);
      };

      window.cerrarPanelComentarios = function () {
        document.getElementById("comments-panel").classList.remove("open");
        currentAvisoIdForComments = null;
      };

      // ==================== CARGAR COMENTARIOS ====================
      async function cargarComentarios(avisoId) {
        const contenedor = document.getElementById("comentarios-container");
        if (!contenedor) return;

        try {
          const apiKey = localStorage.getItem("api_key");
          contenedor.innerHTML = "<p>Cargando comentarios...</p>";

          // ✅ VOLVER A LA VERSIÓN QUE FUNCIONABA
          const respuesta = await API.peticion(
            "LISTAR_COMENTARIOS",
            { avisoId: avisoId },
            apiKey,
          );
          console.log("Comentarios respuesta:", respuesta);

          let comentarios = [];

          if (respuesta && respuesta.success) {
            if (
              respuesta.data &&
              respuesta.data.datos &&
              Array.isArray(respuesta.data.datos)
            ) {
              comentarios = respuesta.data.datos;
            } else if (respuesta.datos && Array.isArray(respuesta.datos)) {
              comentarios = respuesta.datos;
            } else if (Array.isArray(respuesta.data)) {
              comentarios = respuesta.data;
            }
          }

          if (!comentarios || comentarios.length === 0) {
            contenedor.innerHTML =
              '<p class="sin-comentarios">💬 No hay comentarios aún. Sé el primero en comentar.</p>';
            return;
          }

          const escapeHTML = (str) => {
            if (!str) return "";
            return String(str).replace(/[&<>]/g, (m) => {
              if (m === "&") return "&amp;";
              if (m === "<") return "&lt;";
              if (m === ">") return "&gt;";
              return m;
            });
          };

          contenedor.innerHTML = comentarios
            .map(
              (com) => `
            <div class="comentario">
                <div class="comentario-header">
                    <strong class="comment-author${sesionActivaParaAutores ? " autor-visible" : ""}">${escapeHTML(com.usuario_nombre || com.autor || com.usuario_email || "Anónimo")}</strong>
                    <small>${new Date(com.fecha || com.created_at).toLocaleDateString("es-MX", { timeZone: "America/Bahia_Banderas" })}</small>
                </div>
                <div class="comentario-contenido">
                    ${escapeHTML(com.comentario || com.texto || com.contenido)}
                </div>
            </div>
        `,
            )
            .join("");
        } catch (error) {
          console.error("Error cargando comentarios:", error);
          contenedor.innerHTML =
            '<p class="error">❌ Error al cargar comentarios</p>';
        }
      }
      window.enviarComentario = async function () {
        const input = document.getElementById("comment-input");
        const texto = input.value.trim();
        if (!texto) {
          showToast("✏️ Escribe un comentario primero", 1500);
          return;
        }
        if (!currentAvisoIdForComments) {
          showToast("❌ Error: No se identificó el aviso", 1500);
          return;
        }

        // ✅ VERIFICAR USUARIO LOGUEADO ANTES DE CONTINUAR
        const apiKey = localStorage.getItem("api_key");
        if (!apiKey) {
          showToast("🔐 Inicia sesión para comentar", 1500);
          return;
        }

        // ✅ OBTENER EL USUARIO ACTUAL PARA ENVIAR COMO AUTOR
        const usuario = JSON.parse(localStorage.getItem("usuario") || "{}");
        if (!usuario.email) {
          showToast("🔐 Tu sesión ha expirado, inicia sesión nuevamente", 1500);
          return;
        }

        try {
          const resultado = await API.peticion(
            "AGREGAR_COMENTARIO",
            {
              avisoId: currentAvisoIdForComments,
              texto: texto,
              autor: usuario.nombre || usuario.email,
            },
            apiKey,
          );

          if (resultado && resultado.success) {
            input.value = "";
            showToast("💬 Comentario enviado", 1500);
            cargarComentarios(currentAvisoIdForComments);

            // Actualizar contador en la tarjeta
            const card = document.querySelector(
              `.aviso-card[data-id="${currentAvisoIdForComments}"]`,
            );
            if (card) {
              const commentSpan = card.querySelector(
                ".comments-stat .stat-value",
              );
              const currentCount = parseInt(commentSpan.textContent) || 0;
              commentSpan.textContent = currentCount + 1;
            }
          } else {
            showToast(
              "❌ " + (resultado?.error || "Error al enviar comentario"),
              1500,
            );
          }
        } catch (e) {
          console.error("Error:", e);
          showToast("❌ Error de conexión", 1500);
        }
      };

      // ========== FUNCIONES AUXILIARES ==========
      function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function (m) {
          return m === "&" ? "&amp;" : m === "<" ? "&lt;" : "&gt;";
        });
      }

      /* function formatearFecha(fechaStr) {

      function formatearFecha(fechaStr) {
        if (!fechaStr) return "Fecha desconocida";
        try {
          let fecha = new Date(fechaStr);
          if (isNaN(fecha.getTime())) return fechaStr;
          return fecha.toLocaleDateString("es-MX", {
            day: "numeric",
            month: "short",
            year: "numeric",
            timeZone: "America/Bahia_Banderas",
          });
        } catch (e) {
          return fechaStr;
        }
      }

      // Normaliza acentos, mayúsculas y espacios para que "Jose" encuentre "José".
      function normalizarBusqueda(valor) {
        return String(valor ?? "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLocaleLowerCase("es-MX")
          .replace(/\s+/g, " ")
          .trim();
      }

      function searchInAviso(aviso, searchTerm) {
        const consulta = normalizarBusqueda(searchTerm);
        if (!consulta) return true;

        // Los datos del autor pueden llegar con nombres distintos según el origen.
        const camposTexto = [
          aviso.titulo,
          aviso.contenido,
          aviso.categoria,
          aviso.ubicacion,
          aviso.contacto,
          aviso.telefono,
          aviso.celular,
          aviso.whatsapp,
          aviso.numero_contacto,
          aviso.contacto_telefono,
          aviso.phone,
          aviso.usuario_nombre,
          aviso.nombre_autor,
          aviso.autor,
          aviso.nombre_usuario,
          aviso.usuario?.nombre,
          aviso.usuario?.email,
        ];

        const textoAviso = normalizarBusqueda(
          camposTexto.filter(Boolean).join(" "),
        );
        // Permite buscar varias palabras aunque aparezcan en campos diferentes.
        const palabras = consulta.split(" ").filter(Boolean);
        if (palabras.every((palabra) => textoAviso.includes(palabra)))
          return true;

        // Los teléfonos suelen venir con espacios, guiones o prefijos.
        const digitosConsulta = consulta.replace(/\D/g, "");
        if (digitosConsulta.length >= 4) {
          const telefonos = [
            aviso.contacto,
            aviso.telefono,
            aviso.celular,
            aviso.whatsapp,
            aviso.numero_contacto,
            aviso.contacto_telefono,
            aviso.phone,
          ]
            .filter(Boolean)
            .join(" ")
            .replace(/\D/g, "");
          if (telefonos.includes(digitosConsulta)) return true;
        }
        return false;
      }

      function applyFiltersAndSearch() {
        // window.currentSearchTerm es la fuente compartida con el header cargado dinámicamente.
        const consulta = String(
          window.currentSearchTerm ?? currentSearchTerm ?? "",
        ).trim();
        currentSearchTerm = consulta;
        filteredAvisos = consulta
          ? allAvisos.filter((aviso) => searchInAviso(aviso, consulta))
          : [...allAvisos];

        // Invalida cualquier render pendiente de la consulta anterior para evitar carreras al teclear.
        searchRenderVersion++;
        isLoading = false;
        renderedCount = 0;
        hasMore = filteredAvisos.length > 0;
        const container = document.getElementById("avisos-container");
        const loadingTrigger = document.getElementById("loading-trigger");
        if (container) container.innerHTML = "";
        if (loadingTrigger)
          loadingTrigger.style.display = hasMore ? "block" : "none";

        if (!filteredAvisos.length) {
          if (container) {
            container.innerHTML = consulta
              ? '<div class="mensaje mensaje-info" role="status">No encontramos avisos que coincidan con tu búsqueda.</div>'
              : '<div class="mensaje mensaje-info" role="status">No hay avisos disponibles.</div>';
          }
          return;
        }
        loadMoreAvisos();
      }

      // El buscador del encabezado invoca esta función después de cada cambio.
      window.applyFiltersAndSearch = applyFiltersAndSearch;

      function loadMoreAvisos() {
        if (isLoading || !hasMore) return;
        isLoading = true;
        const versionDeRender = searchRenderVersion;
        const loadingTrigger = document.getElementById("loading-trigger");
        if (loadingTrigger) loadingTrigger.style.display = "block";

        setTimeout(() => {
          // Si el usuario siguió escribiendo, descarta el resultado de la consulta anterior.
          if (versionDeRender !== searchRenderVersion) return;

          const start = renderedCount;
          const itemsPerLoad = 12;
          const end = Math.min(start + itemsPerLoad, filteredAvisos.length);
          const newAvisos = filteredAvisos.slice(start, end);

          if (newAvisos.length > 0) {
            appendAvisosToGrid(newAvisos);
            renderedCount = end;
          }

          hasMore = end < filteredAvisos.length;
          if (loadingTrigger)
            loadingTrigger.style.display = hasMore ? "block" : "none";
          isLoading = false;
        }, 0);
      }

      // La sesión de Supabase es la fuente de verdad para revelar nombres.
      async function actualizarEstadoSesionAutores() {
        sesionActivaParaAutores = false;
        try {
          const client = await getSupabaseClient();
          const { data, error } = await client.auth.getSession();
          sesionActivaParaAutores = !error && !!data?.session?.user?.id;
        } catch (error) {
          sesionActivaParaAutores = false;
        }
      }

      // Los nombres se enriquecen solo para una sesión real de Supabase.
      async function enriquecerAvisosConUsuarios(avisos) {
        if (!Array.isArray(avisos) || avisos.length === 0) return avisos;
        try {
          const client = await getSupabaseClient();
          const { data: sessionData, error: sessionError } =
            await client.auth.getSession();
          if (sessionError || !sessionData?.session?.user?.id) return avisos;
          const ids = [
            ...new Set(
              avisos
                .map((a) => a?.created_by || a?.usuario_id)
                .filter(Boolean)
                .map(String),
            ),
          ];
          await Promise.all(
            ids.map(async (id) => {
              try {
                const { data: nombre, error } = await client.rpc(
                  "obtener_nombre_autor",
                  { p_usuario_id: id },
                );
                if (error || !nombre) return;
                avisos.forEach((aviso) => {
                  const autorId = aviso?.created_by || aviso?.usuario_id;
                  if (autorId && String(autorId) === id) {
                    aviso.usuario_nombre = String(nombre).trim();
                    aviso.nombre_autor = String(nombre).trim();
                  }
                });
              } catch (errorAutor) {
                console.warn(`No se pudo obtener el autor ${id}:`, errorAutor);
              }
            }),
          );
        } catch (error) {
          console.warn(
            "No se pudieron obtener los nombres de los autores:",
            error,
          );
        }
        return avisos;
      }

      async function cargarAvisos() {
        if (avisosCargados || isLoadingAvisos) return;
        isLoadingAvisos = true;
        const container = document.getElementById("avisos-container");
        if (container)
          container.innerHTML =
            '<div class="cargando">📰 Cargando avisos...</div>';

        try {
          await actualizarEstadoSesionAutores();
          const resultado = await API.listarPublicos(
            {},
            { pagina: 1, limite: 200 },
          );
          if (resultado && resultado.datos) {
            allAvisos = resultado.datos.filter(
              (a) => a.status === "activo" || a.status === undefined,
            );
            const esDestacado = (aviso) =>
              aviso.destacado === true ||
              aviso.destacado === "TRUE" ||
              aviso.destacado === "true" ||
              aviso.destacado === 1 ||
              aviso.destacado === "1";

            const esUrgente = (aviso) =>
              aviso.urgente === true ||
              aviso.urgente === "TRUE" ||
              aviso.urgente === "true" ||
              aviso.urgente === 1 ||
              aviso.urgente === "1";

            allAvisos.sort((a, b) => {
              // Prioridad: destacados, después urgentes no destacados, después normales.
              // Un aviso urgente y destacado permanece una sola vez en destacados.
              const prioridadA = esDestacado(a) ? 0 : esUrgente(a) ? 1 : 2;
              const prioridadB = esDestacado(b) ? 0 : esUrgente(b) ? 1 : 2;
              if (prioridadA !== prioridadB) return prioridadA - prioridadB;

              // Dentro de cada grupo, el más reciente primero.
              const fechaA = new Date(a.created_at || 0).getTime() || 0;
              const fechaB = new Date(b.created_at || 0).getTime() || 0;
              return fechaB - fechaA;
            });

            // 👇 ENRIQUECER CON NOMBRES DE USUARIOS
            allAvisos = await enriquecerAvisosConUsuarios(allAvisos);

            await cargarTodosLosVotos();
            avisosCargados = true;
            applyFiltersAndSearch();
            aplicarVistaPendiente();
          } else {
            if (container)
              container.innerHTML =
                '<div class="mensaje mensaje-info">📭 No hay avisos disponibles</div>';
          }
        } catch (error) {
          console.error("Error cargando avisos:", error);
          if (container)
            container.innerHTML =
              '<div class="mensaje mensaje-error">❌ Error al cargar avisos</div>';
        } finally {
          isLoadingAvisos = false;
        }
      }

              menuToggle.addEventListener("click", () => {

              });
              document.addEventListener("keydown", e => { if (e.key === "Escape") cerrarMenu(); });
              document.addEventListener("pointerdown", e => { if (!menuAcciones.contains(e.target) && !menuToggle.contains(e.target)) cerrarMenu(); });
              window.addEventListener("resize", () => { if (window.innerWidth > 768) cerrarMenu(); });
            }
            const buscador = headerContainer.querySelector(

                window.matchMedia("(max-width: 768px)").matches;
              const contraer = () =>
                contenedorBuscador.classList.remove("activo");
              const ejecutarBusqueda = () => {
                currentSearchTerm = buscador.value;
                window.currentSearchTerm = buscador.value;
                applyFiltersAndSearch();
              };
              const aceptarBusqueda = () => {
                contraer();
                buscador.blur();
              };
              const cancelarBusqueda = () => {
                buscador.value = "";
                ejecutarBusqueda();
                aceptarBusqueda();
              };

              buscador.addEventListener("focus", () => {
                if (esMovil()) contenedorBuscador.classList.add("activo");
              });
              buscador.addEventListener("input", ejecutarBusqueda);
              buscador.addEventListener("keydown", (event) => {
                if (event.key === "Enter") {
                  event.preventDefault();
                  aceptarBusqueda();
                } else if (event.key === "Escape") {
                  event.preventDefault();
                  cancelarBusqueda();
                }
              });
              headerContainer
                .querySelector("#buscador-aceptar")
                ?.addEventListener("click", aceptarBusqueda);
              headerContainer
                .querySelector("#buscador-cancelar")
                ?.addEventListener("click", cancelarBusqueda);

              document.addEventListener("pointerdown", (event) => {
                if (esMovil() && !contenedorBuscador.contains(event.target))
                  contraer();
              });
            }

            setTimeout(() => {
              if (typeof actualizarHeaderPorSesion === "function")
                actualizarHeaderPorSesion();
            }, 100);
          })
          .catch((err) => console.error("Error cargando header:", err));

        fetch("/common/footer.html")
          .then((response) =>
            response.ok ? response.text() : Promise.reject(),
          )
          .then((data) => {
            const footerContainer = document.getElementById("footer-container");
            if (footerContainer) footerContainer.innerHTML = data;
            // ✅ Actualizar el año manualmente
            const yearSpan = footerContainer.querySelector("#copyright-year");
            if (yearSpan) {
              yearSpan.innerHTML = `&copy; ${new Date().getFullYear()} - El Barrio. Todos los derechos reservados.`;
            }

            // ✅ Forzar la ejecución de scripts después de inyectar
            const scripts = footerContainer.querySelectorAll("script");
            scripts.forEach((oldScript) => {
              const newScript = document.createElement("script");
              if (oldScript.src) {
                newScript.src = oldScript.src;
              } else {
                newScript.textContent = oldScript.textContent;
              }
              document.body.appendChild(newScript);
              oldScript.remove();
            });
          })
          .catch((error) => console.error("Error cargando el footer:", error));
      });

    <script>
      function actualizarHeaderPorSesion() {
        const usuarioStr = localStorage.getItem("usuario");
        const apiKey = localStorage.getItem("api_key");
        const loginLink = document.getElementById("login-link");
        const userArea = document.getElementById("user-area");
        const userNameSpan = document.getElementById("user-name");
        const cerrarBtn = document.getElementById("cerrar-sesion");

        if (!loginLink) {
          setTimeout(actualizarHeaderPorSesion, 200);
          return;
        }

        if (usuarioStr && apiKey) {
          try {
            const usuario = JSON.parse(usuarioStr);
            if (loginLink) loginLink.style.display = "none";
            if (userArea) userArea.style.display = "flex";
            if (userNameSpan) {
              userNameSpan.textContent = `👋 ${usuario.nombre || usuario.email || "Usuario"}`;
              userNameSpan.classList.add("admin-link");
              userNameSpan.style.cursor = "pointer";
              userNameSpan.title = "Abrir panel de administración";
              userNameSpan.setAttribute("role", "link");
              userNameSpan.setAttribute("tabindex", "0");
              userNameSpan.onclick = () => (window.location.href = "/admin.html");
              userNameSpan.onkeydown = (event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); window.location.href = "/admin.html"; } };
            }
            if (cerrarBtn) {
              const nuevoCerrar = cerrarBtn.cloneNode(true);
              nuevoCerrar.dataset.logoutInit = '1';
              cerrarBtn.parentNode.replaceChild(nuevoCerrar, cerrarBtn);
              nuevoCerrar.addEventListener("click", (e) => {
                e.preventDefault();
                localStorage.removeItem("usuario");
                localStorage.removeItem("api_key");
                window.location.href = "/index.html";
              });
            }
          } catch (e) {
            console.error(e);
          }
        } else {
          if (loginLink) loginLink.style.display = "inline-flex";
          if (userArea) userArea.style.display = "none";
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        setTimeout(actualizarHeaderPorSesion, 200);
        setTimeout(actualizarHeaderPorSesion, 500);
        setTimeout(actualizarHeaderPorSesion, 1000);

        // Botón para ir a registro
        const btnRegistro = document.getElementById("btnProbarNotificacion");
        if (btnRegistro) {
          btnRegistro.removeEventListener("click", btnRegistro.clickHandler);
          btnRegistro.clickHandler = () => {
            window.location.href = "/registro.html";
          };
          btnRegistro.addEventListener("click", btnRegistro.clickHandler);
        }
      });
    </script>

    <!-- Estilos para notificaciones -->
    <style>
      .notification {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 15px 20px;
        border-radius: 8px;
        color: white;
        z-index: 10000;
        animation: slideIn 0.3s ease;
        max-width: 300px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      .notification-success {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }

      .notification-error {
        background: linear-gradient(135deg, #f56565 0%, #c53030 100%);
      }

      .notification-info {
        background: linear-gradient(135deg, #4299e1 0%, #2b6cb0 100%);
      }

      .notification-warning {
        background: linear-gradient(135deg, #ed8936 0%, #dd6b20 100%);
      }

      .notification button {
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: white;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        cursor: pointer;
        margin-left: 10px;
        font-weight: bold;
      }

      @keyframes slideIn {
        from {
          transform: translateX(100%);
          opacity: 0;
        }

        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
    </style>

    <!-- Atmósfera estacional ligera: calendario local del dispositivo, sin red, timers ni dependencias. -->
    <script>
      (() => {
        const ahora = new Date();
        const mes = ahora.getMonth() + 1;
        const dia = ahora.getDate();
        const raiz = document.documentElement;
        const temas = {
          halloween: {
            nombre: "halloween",
            fondo: "#faf6f1",
            primario: "#35263f",
            verde: "#5b3a70",
            dorado: "#ef8a28",
            naranja: "#d96c20",
            acento: "#ef8a28",
            barra: "#35263f",
          },
          muertos: {
            nombre: "dia-de-muertos",
            fondo: "#fff8ed",
            primario: "#4b294f",
            verde: "#397257",
            dorado: "#e6a23c",
            naranja: "#e56b35",
            acento: "#e56b35",
            barra: "#4b294f",
          },
          navidad: {
            nombre: "navidad",
            fondo: "#f6f8f3",
            primario: "#24483a",
            verde: "#28704d",
            dorado: "#c6a34d",
            naranja: "#a83f3f",
            acento: "#b7463d",
            barra: "#24483a",
          },
          anioNuevo: {
            nombre: "anio-nuevo",
            fondo: "#f5f6fb",
            primario: "#1c2945",
            verde: "#315563",
            dorado: "#c8a85e",
            naranja: "#c8a85e",
            acento: "#c8a85e",
            barra: "#1c2945",
          },
          reyes: {
            nombre: "dia-de-reyes",
            fondo: "#fbf7ed",
            primario: "#3b3157",
            verde: "#47735b",
            dorado: "#d4a63e",
            naranja: "#a84a3f",
            acento: "#d4a63e",
            barra: "#3b3157",
          },
          patrias: {
            nombre: "fiestas-patrias",
            fondo: "#f7f8f4",
            primario: "#254b3c",
            verde: "#26734d",
            dorado: "#d0ad62",
            naranja: "#b94b43",
            acento: "#26734d",
            barra: "#254b3c",
          },
          base: {
            nombre: "cotidiana",
            fondo: "#f5f5f5",
            primario: "#2c3e50",
            verde: "#2b7a2b",
            dorado: "#d4a043",
            naranja: "#f5b042",
            acento: "#d4a043",
            barra: "#2c3e50",
          },
        };

        let tema = temas.base;
        if (mes === 10 && dia >= 1 && dia <= 30) tema = temas.halloween;
        if ((mes === 10 && dia >= 31) || (mes === 11 && dia <= 2))
          tema = temas.muertos;
        if (mes === 12 && dia >= 1 && dia <= 24) tema = temas.navidad;
        if ((mes === 12 && dia >= 26) || (mes === 1 && dia <= 2))
          tema = temas.anioNuevo;
        if (mes === 1 && dia >= 3 && dia <= 6) tema = temas.reyes;
        if (mes === 9 && dia >= 10 && dia <= 16) tema = temas.patrias;

        raiz.style.setProperty("--color-fondo", tema.fondo);
        raiz.style.setProperty("--color-primario", tema.primario);
        raiz.style.setProperty("--color-verde", tema.verde);
        raiz.style.setProperty("--color-dorado", tema.dorado);
        raiz.style.setProperty("--color-naranja", tema.naranja);
        raiz.style.setProperty("--atmo-accent", tema.acento);
        document.body.dataset.atmosfera = tema.nombre;

        const metaColor = document.querySelector('meta[name="theme-color"]');
        if (metaColor) metaColor.setAttribute("content", tema.barra);
      })();
    </script>
    <script src="/js/metricas-trafico.js?v=20261106-1" defer></script>
