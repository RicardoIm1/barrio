<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piscis Digital | Panel de Eventos</title>
    <link rel="stylesheet" href="/eventos/style.css">
    <!-- Fuente de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Barra Lateral (Navegación) -->
    <aside class="sidebar">
        <div class="logo">
            <h1>♓️ Piscis</h1>
            <span>Digital</span>
        </div>
        <nav>
            <a href="#" class="active">📊 Dashboard</a>
            <a href="#">🎉 Eventos</a>
            <a href="#">👥 Invitados</a>
            <a href="#">💌 Pases Wallet</a>
            <a href="#">💰 Fondo Común</a>
            <a href="#">⚙️ Configuración</a>
        </nav>
        <div class="sidebar-footer">
            <p>Imprenta Piscis © 2026</p>
        </div>
    </aside>

    <!-- Contenido Principal -->
    <main class="main-content">
        <header>
            <h2>Panel de Control</h2>
            <div class="user-profile">
                <span>Bienvenido, Artista</span>
                <div class="avatar">P</div>
            </div>
        </header>

                <!-- SECCIÓN 1: TABLA DE EVENTOS -->
        <section class="table-section" id="seccionEventos">
            <div class="table-header">
                <h3>Todos los Eventos</h3>
                <button class="btn-primary" id="btnNuevoEvento">+ Añadir Evento</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Evento</th>
                        <th>Tipo</th>
                        <th>Fecha</th>
                        <th>Lugar</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaEventos">
                    <!-- Aquí JavaScript inyectará las filas -->
                </tbody>
            </table>
        </section>

        <!-- SECCIÓN 2: TABLA DE INVITADOS (Oculta al inicio) -->
        <section class="table-section hidden" id="seccionInvitados">
            <div class="table-header">
                <div>
                    <button class="btn-sm" id="btnVolverEventos" style="margin-bottom: 0.5rem;">← Volver a Eventos</button>
                    <h3 id="tituloInvitados">Invitados</h3>
                </div>
                <button class="btn-primary" id="btnNuevoInvitado">+ Añadir Invitado</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>WhatsApp</th>
                        <th>Estado del Pase</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaInvitados"></tbody>
            </table>
        </section>
</main>

<!-- MODAL PARA CREAR/EDITAR INVITADOS -->
<div id="modalInvitado" class="modal-overlay hidden">
    <div class="modal-content">
        <h3 id="modalTitulo">Nuevo Invitado</h3>
        <form id="formInvitado">
            <!-- Input oculto para guardar el ID si estamos editando -->
            <input type="hidden" id="invitadoId" value="">
            
            <div class="form-group">
                <label>Nombre Completo:</label>
                <input type="text" id="inputNombre" required placeholder="Ej: Regina Treviño">
            </div>
            <div class="form-group">
                <label>WhatsApp:</label>
                <input type="tel" id="inputWhatsapp" placeholder="Ej: +525512345678">
            </div>
            
            <div class="modal-actions">
                <button type="button" class="btn-cancel" id="btnCerrarModal">Cancelar</button>
                <button type="submit" class="btn-primary" id="btnGuardar">Guardar</button>
            </div>
        </form>
    </div>
</div>
<!-- MODAL PARA CREAR/EDITAR EVENTOS -->
<div id="modalEvento" class="modal-overlay hidden">
    <div class="modal-content" style="max-width: 500px;">
        <h3 id="modalTituloEvento">Nuevo Evento</h3>
        <form id="formEvento">
            <input type="hidden" id="eventoId" value="">
            
            <div class="form-group">
                <label>Nombre del Evento:</label>
                <input type="text" id="inputNombreEvento" required placeholder="Ej: Boda de Andrea & Gerardo">
            </div>
            <div class="form-group">
                <label>Tipo de Evento:</label>
                <select id="inputTipoEvento" required>
                    <option value="boda">Boda</option>
                    <option value="xv_anos">XV Años</option>
                    <option value="bautizo">Bautizo</option>
                    <option value="corporativo">Corporativo</option>
                </select>
            </div>
            <div class="form-group">
                <label>Fecha:</label>
                <input type="date" id="inputFechaEvento" required>
            </div>
            <div class="form-group">
                <label>Lugar:</label>
                <input type="text" id="inputLugarEvento" placeholder="Ej: Stock & Woods">
            </div>
            
            <div class="modal-actions">
                <button type="button" class="btn-cancel" id="btnCerrarModalEvento">Cancelar</button>
                <button type="submit" class="btn-primary" id="btnGuardarEvento">Guardar</button>
            </div>
        </form>
    </div>
</div>
<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/eventos/app.js"></script>
</body>
</html>
